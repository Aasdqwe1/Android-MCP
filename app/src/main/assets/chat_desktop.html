      nameEl.className = "modal-opt-name";
      nameEl.textContent = p.name;
      opt.appendChild(nameEl);
      if (p.description) {
        const descEl = document.createElement("div");
        descEl.className = "modal-opt-desc";
        descEl.textContent = p.description;
        opt.appendChild(descEl);
      }
      list.appendChild(opt);
    });
  };
  render();
  modal.style.display = "flex";
  document.getElementById("newSessionCancel").onclick = () => { modal.style.display = "none"; };
  modal.onclick = (e) => { if (e.target === modal) modal.style.display = "none"; };
  document.getElementById("newSessionOk").onclick = () => {
    modal.style.display = "none";
    createSession(__newSessionMode || null);
  };
}

async function createSession(presetId) {
  if (REMOTE_DESKTOP) {
    const r = await __dsApi("POST", "/web/api/sessions", { presetId: presetId || "" });
    // 先刷新列表让新会话带 presetId，再切换——switchSession 按会话 presetId 同步运行模式与顶栏徽标
    await __dsListSessions();
    await switchSession(r.id);
    renderSessionList();
    return r.id;
  }
  const sessions = __dsLocalSessions();
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  sessions.unshift({ id, title: DEFAULT_TITLE, time: Date.now(), msgCount: 0, presetId: presetId || "" });
  if (sessions.length > 20) sessions.pop();
  __dsSaveLocal(sessions);
  // 应用预设（原生模式）
  if (presetId && window.ChatBridge && typeof window.ChatBridge.setPreset === "function") {
    try { JSON.parse(window.ChatBridge.setPreset(presetId)); } catch (e) {}
  }
  switchSession(id);
  return id;
}

async function __dsListSessions() {
  if (REMOTE_DESKTOP) {
    __dsSessions = await __dsApi("GET", "/web/api/sessions");
    return __dsSessions;
  }
  return __dsLocalSessions();
}

async function switchSession(sessionId) {
  window.currentSessionId = sessionId;
  window.__DS_SID = sessionId;
  __dsRememberSid(sessionId);
  __dsClearView();
  if (REMOTE_DESKTOP) {
    try { await __dsApi("POST", "/web/api/session/current", { sessionId: sessionId }); } catch (e) {}
  } else {
    const sessions = __dsLocalSessions();
    const s = sessions.find(x => x.id === sessionId);
    if (s) { s.msgCount = messages.length; s.time = Date.now(); __dsSaveLocal(sessions); }
  }
  renderSessionList();
  // 同步预设：按当前会话的 presetId 恢复运行模式（无 presetId = 完整模式）
  if (REMOTE_DESKTOP) {
    try {
      const sess = __dsSessions.find(x => x.id === sessionId);
      if (sess) {
        await __dsApi("POST", "/web/api/preset/current", { presetId: sess.presetId || "" });
      }
      __presetRender();
    } catch (e) { /* 预设同步失败静默 */ }
  } else if (window.ChatBridge && typeof window.ChatBridge.setPreset === "function") {
    // WebView 模式：把该会话 presetId 同步到原生当前 preset，徽标随之刷新
    const sessions = __dsLocalSessions();
    const s = sessions.find(x => x.id === sessionId);
    if (s) {
      try { JSON.parse(window.ChatBridge.setPreset(s.presetId || "")); } catch (e) { /* 静默 */ }
    }
  }
  __presetRefreshBadge();
  // 加载此会话的工作区路径
  __updateWorkspacePath(sessionId);
  // 加载此会话的历史消息
  if (REMOTE_DESKTOP) {
    // 刷新（F5）后前端是全新上下文：没有 currentAi，正在生成的气泡/「停止」按钮都没了，
    // 而服务端的流还在跑。先取活跃流快照，随 onHistory 第二参数确定性恢复
    // （快照与历史之间到达的 delta 由 onChatEvent 缓冲进 __dsPendingResume，不丢字）。
    __dsRestoreEndedWhileLoading = false;
    __dsPendingResume = await __dsFetchStreamResume(sessionId);
    try {
      const payload = await __dsApi("GET", "/web/api/sessions/" + encodeURIComponent(sessionId) + "/messages?offset=0&limit=50");
      if (typeof window.onHistory === "function") window.onHistory(payload, __dsResumeArg());
    } catch (e) {
      toast("历史加载失败：" + (e && e.message ? e.message : e));
    } finally {
      // 快照只服务这一次 onHistory：此后 delta 走正常 currentAi 链路
      __dsPendingResume = null;
    }
    // 极端时序：取快照/拉历史期间流已结束（终态正文那一刻才落盘），重拉最新一页补上它。
    // 放在请求流水恢复之前——__dsClearView 会清空看板列表，顺序反了会让流水被清掉。
    if (__dsRestoreEndedWhileLoading) {
      __dsRestoreEndedWhileLoading = false;
      try {
        __dsClearView();
        const again = await __dsApi("GET", "/web/api/sessions/" + encodeURIComponent(sessionId) + "/messages?offset=0&limit=50");
        if (typeof window.onHistory === "function") window.onHistory(again, null);
        scrollToBottom();
      } catch (e) { /* 静默：手动刷新即可见 */ }
    }
    // 加载此会话的请求流水（历史分页，最近 50 条）
    try {
      const flow = await __dsApi("GET", "/web/api/token_flow/page?sessionId=" + encodeURIComponent(sessionId) + "&offset=0&limit=50");
      applyTokenFlowRestore(flow);
    } catch (e) { /* 请求流水拉取失败静默，不阻塞会话切换 */ }
  } else {
    try {
      const saved = JSON.parse(localStorage.getItem("chat_msgs_" + sessionId)) || [];
      saved.forEach(msg => {
        if (msg.role === "user") addUserBubble(msg.text);
        else { addAssistantBubble(); }
      });
    } catch {}
  }
  scrollToBottom();
  // 切换会话后刷新产物托盘（后台更新角标，若抽屉打开则重绘列表）
  if (typeof __trayLoadList === "function") __trayLoadList();
}

async function deleteSession(sessionId) {
  if (!(await __confirmDlg("确定删除此对话？"))) return;
  if (REMOTE_DESKTOP) {
    try {
      await __dsApi("DELETE", "/web/api/sessions/" + encodeURIComponent(sessionId));
      await __dsListSessions();
      if (window.currentSessionId === sessionId) {
        window.currentSessionId = null;
        window.__DS_SID = "";
        try { localStorage.removeItem("chat_desktop_current_sid"); } catch (err) { /* 静默 */ }
        if (__dsSessions.length > 0) await switchSession(__dsSessions[0].id);
        else await createSession();
      }
      renderSessionList();
    } catch (e) { toast("删除失败：" + (e && e.message ? e.message : e)); }
  } else {
    const updated = __dsLocalSessions().filter(x => x.id !== sessionId);
    try { localStorage.removeItem("chat_msgs_" + sessionId); } catch {}
    __dsSaveLocal(updated);
    renderSessionList();
  }
}

function __fmtSessionTime(ts) {
  const v = Number(ts) || 0;
  if (v <= 0) return "时间未知";
  const ms = v < 1e12 ? v * 1000 : v;
  const d = new Date(ms);
  if (isNaN(d.getTime())) return "时间未知";
  return d.toLocaleDateString() + " " + d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
// 同步顶栏的当前会话名称（居中徽标）
function __updateTopSessionName() {
  const el = document.getElementById("sessionTitle");
  if (!el) return;
  const sessions = REMOTE_DESKTOP ? __dsSessions : __dsLocalSessions();
  const cur = sessions.find(s => s.id === window.currentSessionId);
  el.textContent = (cur && cur.title) ? cur.title : (window.currentSessionId ? DEFAULT_TITLE : "—");
  const wrap = el.closest(".tb-session-name");
  if (wrap) wrap.title = el.textContent;
}

function renderSessionList() {
  const sessions = REMOTE_DESKTOP ? __dsSessions : __dsLocalSessions();
  const list = document.getElementById("session-list");
  if (!list) return;
  __updateTopSessionName();
  const q = (__dsQuery || "").trim().toLowerCase();
  const filtered = sessions.filter(s => !q || ((s.title || DEFAULT_TITLE) + "").toLowerCase().indexOf(q) >= 0);
  const sorted = filtered.slice().sort((a, b) => {
    const pa = a.pinned ? 1 : 0, pb = b.pinned ? 1 : 0;
    if (pa !== pb) return pb - pa;
    return (b.updatedAt || b.time || 0) - (a.updatedAt || a.time || 0);
  });
  list.innerHTML = "";
  if (sorted.length === 0) {
    const empty = document.createElement("div");
    empty.className = "session-empty";
    empty.textContent = q ? "没有匹配的会话" : "暂无会话";
    list.appendChild(empty);
    return;
  }
  sorted.forEach(s => {
    const item = document.createElement("div");
    item.className = "session-item" + (s.pinned ? " pinned" : "") + (s.id === window.currentSessionId ? " active" : "");
    const timeStr = __fmtSessionTime(s.updatedAt || s.time || 0);
    const modeName = __presetName(s.presetId);
    const modeCls = __presetModeClass(s.presetId);
    item.innerHTML =
      `<div class="session-title">${escapeHtml(s.title || DEFAULT_TITLE)}</div>` +
      `<div class="session-time">${timeStr} · ${s.msgCount || 0}条 <span class="session-mode ${modeCls}" title="运行模式：${escapeHtml(modeName)}">${escapeHtml(modeName)}</span></div>` +
      `<div class="item-actions">` +
        `<button class="act-pin${s.pinned ? " on" : ""}" title="${s.pinned ? "取消置顶" : "置顶"}">${s.pinned ? "⇩" : "⇧"}</button>` +
        `<button class="act-rename" title="重命名">✎</button>` +
        `<button class="act-del danger" title="删除">✕</button>` +
      `</div>`;
    item.addEventListener("click", () => switchSession(s.id));
    item.querySelector(".act-rename").addEventListener("click", (e) => { e.stopPropagation(); __dsStartRename(item, s); });
    item.querySelector(".act-pin").addEventListener("click", async (e) => {
      e.stopPropagation();
      try { await __dsPinSession(s.id, !s.pinned); s.pinned = !s.pinned; if (REMOTE_DESKTOP) await __dsListSessions(); }
      catch (err) { toast("操作失败：" + (err && err.message ? err.message : err)); }
      renderSessionList();
    });
    item.querySelector(".act-del").addEventListener("click", (e) => { e.stopPropagation(); deleteSession(s.id); });
    list.appendChild(item);
  });
}

  }

}

function __dsPinSession(sessionId, pinned) {
  if (REMOTE_DESKTOP) {
    return __dsApi("POST", "/web/api/sessions/" + encodeURIComponent(sessionId), { pinned: pinned });
  }

function __dsStartRename(item, s) {
  const titleEl = item.querySelector(".session-title");
  if (!titleEl) return;
  const input = document.createElement("input");
  input.type = "text";
  input.className = "rename-input";
  input.value = s.title || "";
  input.placeholder = DEFAULT_TITLE;
  titleEl.replaceWith(input);
  input.focus();
  input.select();
  item.classList.add("renaming");
  let finished = false;
  const commit = async (apply) => {
    if (finished) return;
    finished = true;
    const v = input.value.trim();
    if (apply && v && v !== (s.title || "")) {
      try { await __dsRenameSession(s.id, v); s.title = v; if (REMOTE_DESKTOP) { try { await __dsListSessions(); } catch (e) {} } }
      catch (err) { toast("重命名失败：" + (err && err.message ? err.message : err)); }
    }
    renderSessionList();
  };
  input.addEventListener("keydown", (e) => {
    e.stopPropagation();
    if (e.key === "Enter") input.blur();
    else if (e.key === "Escape") commit(false);
  });
  input.addEventListener("blur", () => commit(true));
}

      const remembered = __dsRememberedSid();
      const target = (remembered && __dsSessions.some(s => s.id === remembered))
        ? remembered

// ── 产物托盘 ──────────────────────────────────────────────────────────
const TRAY = { timer: null };

function __trayEl(id) { return document.getElementById(id); }

function __trayFmtSize(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
    return (bytes / (1024 * 1024)).toFixed(1) + " MB";
}

async function __trayLoadList() {
    const sid = window.currentSessionId;
    if (!sid || !REMOTE_DESKTOP) { __trayRenderList([], null); return; }
    try {
        const data = await __dsApi("GET", "/web/api/sessions/" + encodeURIComponent(sid) + "/workspace");
        __trayRenderList((data && data.files) || [], data && data.path);
    } catch (e) {
        __trayRenderList([], null);
        if (__trayEl("trayDrawer").classList.contains("open")) {
            toast("加载产物失败：" + (e && e.message ? e.message : e));
        }
    }
}

function __trayRenderList(files, wsPath) {
    const countEl = __trayEl("trayCount");
    const infoEl = __trayEl("trayInfo");
    const listEl = __trayEl("trayList");
    if (countEl) {
        countEl.textContent = String(files.length);
        countEl.classList.toggle("zero", files.length === 0);
    }
    if (infoEl) infoEl.textContent = wsPath ? wsPath : "无当前会话";
    if (!listEl) return;
    if (!files.length) {
        listEl.innerHTML = '<div class="tray-empty">当前会话暂无产物文件</div>';
        return;
    }
    listEl.innerHTML = "";
    files.forEach(f => {
        const row = document.createElement("div");
        row.className = "tray-file";
        const nameEl = document.createElement("div");
        nameEl.className = "f-name";
        nameEl.textContent = f.name;
        nameEl.title = f.name;
        const metaEl = document.createElement("div");
        metaEl.className = "f-meta";
        metaEl.textContent = __trayFmtSize(f.size || 0);
        const btn = document.createElement("button");
        btn.className = "f-download";
        btn.textContent = "下载";
        btn.onclick = () => __trayDownload(f.name);
        row.appendChild(nameEl);
        row.appendChild(metaEl);
        row.appendChild(btn);
        listEl.appendChild(row);
    });
}

function __trayDownload(name) {
    const sid = window.currentSessionId;
    if (!sid) { toast("请选择会话"); return; }
    const url = "/web/api/sessions/" + encodeURIComponent(sid) + "/workspace/" +
                encodeURIComponent(name);
    window.open(url, "_blank");
}

function __trayOpen() {
    __trayEl("trayDrawer").classList.add("open");
    __trayEl("trayMask").classList.add("open");
    if (TRAY.timer) clearInterval(TRAY.timer);
    __trayLoadList();
    TRAY.timer = setInterval(__trayLoadList, 30000);
}

function __trayClose() {
    __trayEl("trayDrawer").classList.remove("open");
    __trayEl("trayMask").classList.remove("open");
    if (TRAY.timer) { clearInterval(TRAY.timer); TRAY.timer = null; }
}

function __trayToBase64(file) {
    return new Promise((resolve, reject) => {
        const fr = new FileReader();
        fr.onload = () => {
            const result = fr.result || "";
            if (typeof result === "string") {
                const idx = result.indexOf(",");
                resolve(idx >= 0 ? result.slice(idx + 1) : result);
            } else {
                reject(new Error("unexpected FileReader result"));
            }
        };
        fr.onerror = () => reject(new Error("read file failed"));
        fr.readAsDataURL(file);
    });
}

async function __trayUpload(file) {
    const sid = window.currentSessionId;
    if (!sid) { toast("请选择会话"); return; }
    if (!file || !file.size) { toast("文件为空"); return; }
    const btn = __trayEl("trayUploadBtn");
    if (btn) btn.disabled = true;
    try {
        const b64 = await __trayToBase64(file);
        await __dsApi("POST", "/web/api/sessions/" + encodeURIComponent(sid) + "/workspace", {
            filename: file.name,
            content_base64: b64,
        });
        toast("已上传：" + file.name);
        await __trayLoadList();
    } catch (e) {
        toast("上传失败：" + (e && e.message ? e.message : e));
    } finally {
        if (btn) btn.disabled = false;
    }
}

function __initTray() {
    const btn = __trayEl("trayBtn");
    if (btn) btn.addEventListener("click", () => {
        if (__trayEl("trayDrawer").classList.contains("open")) __trayClose();
        else __trayOpen();
    });
    const closeBtn = __trayEl("trayCloseBtn");
    if (closeBtn) closeBtn.addEventListener("click", __trayClose);
    const mask = __trayEl("trayMask");
    if (mask) mask.addEventListener("click", __trayClose);
    const upBtn = __trayEl("trayUploadBtn");
    const fileInput = __trayEl("trayFileInput");
    if (upBtn && fileInput) {
        upBtn.addEventListener("click", () => fileInput.click());
        fileInput.addEventListener("change", () => {
            if (fileInput.files && fileInput.files[0]) {
                __trayUpload(fileInput.files[0]);
            }
            fileInput.value = "";
        });
    }
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && __trayEl("trayDrawer").classList.contains("open")) {
            __trayClose();
        }
    });
}

// ── 运行模式（预设）切换 ─────────────────────────────────────────────
function __presetEl(id) { return document.getElementById(id); }

// 预设 id → 显示名：优先查已加载列表；列表未就绪时按内置三种模式兜底（命名与 PresetRuntime.FULL 一致）。
function __presetName(id) {
  const key = (id || "").trim();
  if (__presetList.length) {
    const o = __presetList.find(p => (p.id || "") === key);
    if (o) return o.name;
  }
  if (!key || key === "full") return "完整模式";
  if (key === "minimal") return "极简模式";
  if (key === "ptc") return "PTC 编程模式";
  return key;
}

// 会话列表模式小标配色类别
function __presetModeClass(id) {
  const key = (id || "").trim();
  if (key === "minimal") return "mode-minimal";
  if (key === "ptc") return "mode-ptc";
  return "mode-full";
}

// 顶栏「模式」徽标：显示当前生效 preset（切换/新建会话后跟随会话 presetId 刷新）
function __presetRefreshBadge() {
  const badge = __presetEl("presetBadge");
  const nameEl = __presetEl("presetName");
  if (!nameEl) return;
  if (!window.ChatBridge || typeof window.ChatBridge.getPreset !== "function") {
    if (badge) badge.style.display = "none";
    return;
  }
  if (badge) badge.style.display = "";
  let cur = "";
  try { cur = window.ChatBridge.getPreset() || ""; } catch (e) { cur = ""; }
  nameEl.textContent = __presetName(cur);
}

function __presetRender() {
    // 徽标文本与下拉高亮同步刷新（切换/新建会话后顶栏要跟随当前 preset）
    __presetRefreshBadge();
    const list = __presetEl("presetList");
    if (!list) return;
    const cur = typeof window.ChatBridge !== "undefined" ? window.ChatBridge.getPreset() : "";
    list.innerHTML = "";
    __presetList.forEach(p => {
        const div = document.createElement("div");
        div.className = "opt" + (p.id === cur ? " active" : "");
        div.dataset.id = p.id;
        const nameEl = document.createElement("div");
        nameEl.className = "opt-name";
        nameEl.textContent = p.name;
        div.appendChild(nameEl);
        if (p.description) {
            const descEl = document.createElement("div");
            descEl.className = "opt-desc";
            descEl.textContent = p.description;
            div.appendChild(descEl);
        }
        div.addEventListener("click", () => __presetSelect(p.id));
        list.appendChild(div);
    });
    // 底部提示
    const hint = document.createElement("div");
    hint.className = "opt-hint";
    hint.textContent = "切换后生效，新对话即用新工具集";
    list.appendChild(hint);
}

function __presetToggle() {
    __presetOpen = !__presetOpen;
    const list = __presetEl("presetList");
    if (list) list.classList.toggle("open", __presetOpen);
}

function __presetClose() {
    __presetOpen = false;
    const list = __presetEl("presetList");
    if (list) list.classList.remove("open");
}

async function __presetSelect(id) {
    __presetClose();
    const cb = window.ChatBridge;
    if (!cb || typeof cb.setPreset !== "function") {
        toast("当前模式不支持切换运行模式");
        return;
    }
    // 二次确认：切换会重新注册工具，历史会话中的工具结果不再可复现
    const cur = cb.getPreset();
    if (cur === id) return;
    const opt = __presetList.find(p => p.id === id);
    const label = (opt && opt.name) || (id || "完整");
    const msg = id ? "切换到「" + label + "」？" : "切回「完整」？";
    if (!(await __confirmDlg(msg + " 新工具集从下一条消息开始生效。"))) return;
    try {
        const result = JSON.parse(cb.setPreset(id));
        if (result.ok) {
            const nameEl = __presetEl("presetName");
            if (nameEl) nameEl.textContent = result.name;
            // 同步当前会话 presetId：会话列表模式小标与再次打开时的模式恢复都依赖它
            const sid = window.currentSessionId;
            if (sid) {
                if (REMOTE_DESKTOP) {
                    const sess = __dsSessions.find(x => x.id === sid);
                    if (sess) sess.presetId = result.id;
                } else {
                    const sessions = __dsLocalSessions();
                    const s = sessions.find(x => x.id === sid);
                    if (s) { s.presetId = result.id; __dsSaveLocal(sessions); }
                }
            }
            renderSessionList();
            toast("已切换：" + result.name);
        } else {
            toast("切换失败：" + (result.error || "未知错误"));
        }
    } catch (e) {
        toast("切换失败：" + (e.message || e));
    }
}

function __initPreset() {
    const badge = __presetEl("presetBadge");
    if (!badge) return;
    // 非原生 WebView 环境（浏览器模式）不显示
    if (!window.ChatBridge || typeof window.ChatBridge.listPresets !== "function") {
        badge.style.display = "none";
        return;
    }
    try {
        __presetList = JSON.parse(window.ChatBridge.listPresets());
    } catch (e) {
        badge.style.display = "none";
        return;
    }
    // 只更新显示标签（不可点击切换，仅新建会话时可选）
    __presetRefreshBadge();
}
__initPreset();

</script>
