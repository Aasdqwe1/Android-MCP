      ai.thinkEl.style.display = "none";
    }
    ai.state.contentRaw = m.content || "";
    if (ai.state.contentRaw) {
      setMarkdown(ai.contentEl, stripToolCalls(ai.state.contentRaw));
    }
    // 历史工具调用气泡：收集并追加「本次修改汇总」
    trackFileChange(ai.state, m.toolCall.name, m.toolCall.arguments, resultText);
    renderModSummary(ai.state, ai.row.querySelector(".content"));
    const e = messages[ai.row.dataset.regIdx];
    e.id = m.id || null; e.parentId = m.parentId || null;
  } else {
    const ai = addAssistantBubble();
    if (mode === "prepend") {
      const anchor = prependAnchor();
      messagesEl.insertBefore(ai.row, anchor);
    }
    ai.state.thinkRaw = m.thinking || "";
    if (ai.state.thinkRaw) {
      setMarkdown(ai.thinkBody, ai.state.thinkRaw);
      ai.thinkEl.classList.remove("collapsed");
    } else {
      ai.thinkEl.style.display = "none";
    }
    ai.state.contentRaw = m.content || "";
    setMarkdown(ai.contentEl, stripToolCalls(ai.state.contentRaw));
    const e = messages[ai.row.dataset.regIdx];
    e.id = m.id || null; e.parentId = m.parentId || null;
  }
}

// ── 分页加载「更早」的历史消息 ──
// 从原生层 getMessagesPage 拉一页，用 renderHistoryMessage("prepend") 逐条渲染到顶部；
// 关键：prepend 会让 scrollHeight 变大，若不平移 scrollTop，视口会「跳」到底部。
// 做法：记录 prepend 前 scrollHeight，全部 prepend 完后把 scrollTop += 高度差。
function loadOlderMessages() {
  if (loadingOlderMessages || !hasOlderMessages) return;
  loadingOlderMessages = true;
  try {
    const sid = (window.ChatBridge && window.ChatBridge.getCurrentSessionIdForJs)
      ? window.ChatBridge.getCurrentSessionIdForJs()
      : (window.__currentSessionId || "");
    const limit = window.__historyPageSize || 50;
    const offset = olderMessagesOffset;
    let payload = {};
    try {
      const raw = window.ChatBridge.getMessagesPage(sid, offset, limit) || "{}";
      payload = JSON.parse(raw) || {};
    } catch (e) {
      console.warn("loadOlderMessages: getMessagesPage 异常", e);
    }
    const list = payload.messages || [];
    if (!list.length) {
      hasOlderMessages = false;
      const sentinel = document.getElementById("olderMessagesSentinel");
      if (sentinel) sentinel.style.display = "none";
      return;
    }
    // 1. 记录 prepend 前的滚动状态与容器高度
    const oldScrollHeight = messagesEl.scrollHeight;
    const prevScrollTop = messagesEl.scrollTop;
    // 暂停自动滚动：renderHistoryMessage 内部 addUserBubble/addAssistantBubble 会调 scrollToBottom()
    _allowAutoScroll = false;

    // 2. 逐条渲染到顶部（DOM 前移由 renderHistoryMessage 内部完成）。
    // 关键：renderHistoryMessage("prepend") 把新行插到 sentinel 之后（sentinel 始终在 DOM 顶部）。
    //   每插一条，新行都会挤到「sentinel 之后 → 当前 batch 首条之前」的最上方位置。
    //   因此 list 必须**反向遍历**才能得到「oldest→newest」的正确时序（oldest 在 DOM 顶部）。
    //   若不反向，DOM 视觉上会是 newest→oldest（最新在最上），与 messages 数组下标语义冲突。
    const beforeCount = messages.length;
    list.slice().reverse().forEach(m => renderHistoryMessage(m, "prepend"));
    const insertedCount = messages.length - beforeCount;

    // 3. 前移 messages 数组：新增项（在追加时被 push 到末尾，且是反向的 m49,m48,...,m0）
    //    需要 reverse 回到 oldest→newest，再拼到 oldEntries 前。
    const newEntries = messages.slice(messages.length - insertedCount).reverse();
    const oldEntries = messages.slice(0, messages.length - insertedCount);
    messages.length = 0;
    for (const e of newEntries) messages.push(e);
    for (const e of oldEntries) messages.push(e);

    // 4. 更新 idx + row.dataset.regIdx（与 ctxMenu 的按下标查找路径一致）
    for (let i = 0; i < messages.length; i++) {
      messages[i].idx = i;
      if (messages[i].row) messages[i].row.dataset.regIdx = i;
    }

    // 5. 保持视口位置：scrollTop 增加 prepend 的高度差。
    //    统一锚定在用户当前看到的位置（拉一页看一页）；不能在贴近顶部时跳 scrollTop=0——
    //    那会把视口弹到新页最顶端，scroll 事件再次命中 <60 阈值，引发「一拉到底」的
    //    级联加载，分页形同虚设且大 DOM 一次性全量渲染造成卡顿。
    const newScrollHeight = messagesEl.scrollHeight;
    messagesEl.scrollTop = prevScrollTop + (newScrollHeight - oldScrollHeight);

    // 6. 更新分页状态
    olderMessagesOffset += insertedCount;
    hasOlderMessages = !!payload.hasMore;
    if (!hasOlderMessages) {
      const sentinel = document.getElementById("olderMessagesSentinel");
      if (sentinel) sentinel.style.display = "none";
    }
    // 关键：不无条件恢复 _allowAutoScroll。用户在顶部时保持 false，
    // 避免 streaming 期间下一个 delta 触发 scrollToBottom 把视口从顶部拉回底部。
    // 仅在「用户本来就紧贴底部」时才恢复跟随。
    _allowAutoScroll = (messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight) < 80;
  } catch (err) {
    console.warn("loadOlderMessages error:", err);
    // 出错同样只在贴近底部时才恢复，避免视口被强拉
    _allowAutoScroll = (messagesEl.scrollHeight - messagesEl.scrollTop - messagesEl.clientHeight) < 80;
  } finally {
    loadingOlderMessages = false;
  }
}

// 渲染「当前」文本段（每段各自剥离 tool_calls，故文本1→卡片→文本2 可线性排列）
function renderCurSeg(state) {
  const seg = state.curSeg;
  scheduleMarkdown(seg.el, () => stripToolCalls(seg.raw));
}

// 渲染工具续聊轮的线性思考块：把 delta 追加到「当前思考块」。
// 思考块插在 curSeg 之前（即工具卡片之后、续聊内容之前），每个工具调用轮
// 一个独立思考块，与文本段线性交替。不追加到气泡顶部的原始思考区。
function renderLinearThink(state, delta) {
  if (!state) return;
  // 若当前无思考块，或思考块已不在 curSeg 前（新工具调用轮已开始），新建一个
  if (!state.curThinkBlock || state.curThinkBlock.done) {
    const el = document.createElement("div");
    el.className = "think";
    el.innerHTML = '<span class="label">[思考]</span><div class="body"></div>';
    const body = el.querySelector(".body");
    el.addEventListener("click", () => el.classList.toggle("collapsed"));
    const seg = state.curSeg;
    seg.el.parentNode.insertBefore(el, seg.el);
    state.curThinkBlock = { el: el, body: body, raw: "", done: false };
    state.thinkBlocks.push(state.curThinkBlock);
  }
  const tb = state.curThinkBlock;
  tb.raw += delta;
  scheduleMarkdown(tb.body, () => tb.raw);
  tb.el.classList.remove("collapsed");
}

// 结束当前线性思考块（该轮续聊思考收尾后由 content 事件触发）
function closeLinearThink(state) {
  if (state && state.curThinkBlock) {
    state.curThinkBlock.done = true;
  }
}

// ── 加载历史消息（原生层拉取后注入）──
window.onHistory = function(payload, resume) {
  historyLoaded = true;   // 历史已就绪：此后别端流事件可以安全地建气泡
  // 历史消息加载完成，隐藏初始化加载动画
  var chatLoading = document.getElementById('chatLoading');
  if (chatLoading) chatLoading.style.display = 'none';

  const list = (payload && payload.messages) || [];

  // 分页元数据：payload 带 total/hasMore 时启用「向上滚动加载更早历史」（旧后端未带则退化为一次性全量）
  if (payload && payload.total != null) {
    messagesTotal = payload.total || 0;
    hasOlderMessages = !!payload.hasMore;
    // offset 基线 = 本次已注入的条数：上拉下一页要从「已加载条数」处继续往回取。
    // 若直接用 payload.offset（恒 0），首拉会重复取到与初始页相同的最新一页（重复气泡）。
    olderMessagesOffset = (payload.offset || 0) + list.length;
  }

  // 创建/显示「加载更早」哨兵节点（顶部；仅当 hasOlder 时可见）
  let sentinel = document.getElementById("olderMessagesSentinel");
  if (!sentinel) {
    sentinel = document.createElement("div");
    sentinel.id = "olderMessagesSentinel";
    sentinel.className = "older-sentinel";
    sentinel.style.padding = "10px 12px";
    sentinel.style.textAlign = "center";
    sentinel.style.fontSize = "12px";
    sentinel.style.opacity = ".55";
    sentinel.style.color = "var(--muted, #888)";
    sentinel.textContent = "上拉加载更早消息";
    messagesEl.insertBefore(sentinel, messagesEl.firstChild);
  }
  if (hasOlderMessages) sentinel.style.display = ""; else sentinel.style.display = "none";

  list.forEach(m => renderHistoryMessage(m, "append"));
  // 回填分支选择状态（重启/切会话后仍停在用户上次手动切的分支），必须在 recomputeVisibility 之前，
  // 否则会被 recomputeVisibility 里的「默认取最新一轮」覆盖掉。
  restoreBranchState();
  recomputeVisibility();
  scrollToBottom();
  // 历史加载完成后，检查是否有待恢复的活跃流（由原生层以第二参数确定性下发，不再走全局变量接力）
  if (resume) {
    const p = resume;
    // 恢复流状态
    // 关键：历史里若最后一条是 user（当前提问），说明本轮流式回复尚未写入历史，
    // 此时必须新建一个助手气泡承载流内容，而不是把流内容覆盖到上一条已完成的 AI 回复上。
    const lastMsg = messages.length ? messages[messages.length - 1] : null;
    const reuseLastAi = !!(lastMsg && lastMsg.role === "ai");
    let aiEntry = null;
    let aiRow = null;
    if (reuseLastAi) {
      aiEntry = lastMsg;
      aiRow = aiEntry.row;
      // 标记为 streaming，确保后续代码能正确识别
      aiEntry.streaming = true;
    }
    if (aiEntry && aiRow) {
      // 桥接：addAssistantBubble 已把渲染字段挂到 entry 上，直接作为 currentAi 即可
      currentAi = aiEntry;
      // 已有 AI 气泡，更新内容（如果有）
      if (p.content && p.content.length > 0) {
        aiEntry.content = p.content;
        aiEntry.state.contentRaw = p.content;
        if (aiEntry.state.curSeg) aiEntry.state.curSeg.raw = p.content;
        const contentEl = aiEntry.state.contentEl || aiEntry.row.querySelector(".content");
        setMarkdown(contentEl, stripToolCalls(p.content));
        if (!contentEl.innerHTML) contentEl.textContent = p.content;
      }
      // 恢复思考内容（如果有）
      if (p.thinking && p.thinking.length > 0) {
        aiEntry.state.thinkRaw = p.thinking;
        if (aiEntry.thinkEl && aiEntry.thinkBody) {
          setMarkdown(aiEntry.thinkBody, p.thinking);
          aiEntry.thinkEl.classList.remove("collapsed");
        }
      }
      // 如果内容为空，但气泡已存在，保留"正在生成…"占位（不写 contentRaw，避免污染后续 SSE 追加）
      if (!aiEntry.content || aiEntry.content.length === 0) {
        aiEntry.content = "正在生成…";
        const contentEl = aiEntry.state.contentEl || aiEntry.row.querySelector(".content");
        setMarkdown(contentEl, "正在生成…");
        if (!contentEl.innerHTML) contentEl.textContent = "正在生成…";
      }
    } else {
      // 本轮回复在历史里还没有对应气泡（或最后一条是用户提问）：新建一个助手气泡承载流内容
      const ai = addAssistantBubble();
      const e = messages[ai.row.dataset.regIdx];
      if (e) {
        e.id = p.msgId || String(Date.now());
        e.parentId = lastId || null;
        e.streaming = true;
        e.branch = currentBranch;
      }
      // 恢复思考内容（如果有）
      if (p.thinking && p.thinking.length > 0) {
        ai.state.thinkRaw = p.thinking;
        if (ai.thinkEl && ai.thinkBody) {
          setMarkdown(ai.thinkBody, p.thinking);
          ai.thinkEl.classList.remove("collapsed");
        }
      } else {
        ai.thinkEl.style.display = "none";
      }
      // 同步 contentRaw/curSeg.raw，避免后续 SSE content 通过 renderCurSeg 覆盖已渲染 DOM
      if (p.content) {
        ai.state.contentRaw = p.content;
        ai.state.curSeg.raw = p.content;
      }
      const placeholder = p.content && p.content.length > 0 ? p.content : "正在生成…";
      setMarkdown(ai.contentEl, stripToolCalls(placeholder));
      if (!ai.contentEl.innerHTML) ai.contentEl.textContent = placeholder;
      currentAi = ai;
    }
    scrollToBottom();
    // 恢复按钮状态为"停止"
    busy = true;
    inputEl.disabled = true;
    sendBtn.textContent = "停止";
    sendBtn.classList.add("stopping");
  } else {
    // 没有活跃流，重置为"发送"并隐藏任何遗留横幅
    hideBanner();
    busy = false;
    inputEl.disabled = false;
    sendBtn.textContent = "发送";
    sendBtn.classList.remove("stopping");
  }
};

// ── 原生层通过这里回传事件 ──
window.onChatEvent = function(event, data) {
  // ── Token 看板：后端真实数据接入（Kotlin 经 evaluateJavascript 推送）──
  if (event === "tokenConfig") { applyTokenConfig(data); return; }
  if (event === "tokenFlow") { pushTokenFlow(data); return; }
  if (event === "tokenFlowRestore") { handleTokenFlowRestore(data); return; }
  // ── 上下文压缩状态：压缩时 token 看板入口闪烁，压缩完成后恢复 ──
  if (event === "compacting") {
    if (data && data.active) {
      tokenMini && tokenMini.classList.add("compacting");
    } else {
      tokenMini && tokenMini.classList.remove("compacting");
    }
    return;
  }
  if (event === "clear") {
    // 切换/新建会话：DOM 与消息注册表必须一起清，否则上个会话的节点会继续参与建树
    // （旧节点已脱离文档，切换器会挂到不可见元素上，分支计数也会串会话）
    messagesEl.innerHTML = "";
    messages.length = 0;
    activeTurn = {}; userSwitched = {};
    lastId = null;
    pendingRegen = null; pendingEditIds = null; pendingEdit = null;
    pendingParentForNext = null; clearParentForNext = false;
    historyLoaded = false;   // 视图重建中：历史回来之前不抢建气泡
    currentAi = null; busy = false;
    inputEl.disabled = false;
    sendBtn.textContent = "发送"; sendBtn.classList.remove("stopping");
    cancelEdit();
    hideSelUI();
    hideBanner();
    cancelRecordingIfAny();
    clearAttachments();
    // 新会话：历史基线清零（已使用 = 仅当前输入框内容）
    lastPromptTokens = 0;
    liveStreamTokens = 0;
    refreshTokenView();
    return;
  }
  // 终态事件：无论 currentAi 是否存在都要复位顶部横幅与按钮状态。
  // 页面重载后流可能在前端恢复前就已结束，此时 done/error/stopped 到达时 currentAi
  // 尚未建立；若在此处直接 return，会导致「继续生成中…」横幅常亮不消失。
  if (event === "done" || event === "error" || event === "stopped") {
    powEl.style.display = "none";
    hideBanner();
    busy = false; sendBtn.disabled = false; inputEl.disabled = false;
    sendBtn.textContent = "发送"; sendBtn.classList.remove("stopping");
  }
  // 语音闭环事件：可能在无活跃 AI 轮时发生（空闲录音/转写），须在 currentAi 判空前处理
  if (event === "recording_started") {
    micPending = false; recording = true;
    setMicUI();
    return;
  }
  if (event === "recording_error") {
    micPending = false; recording = false;
    setMicUI();
    toast("录音失败：" + (data.message || "麦克风不可用"));
    return;
  }
  if (event === "transcribed") {
    micBusy = false; setMicUI();
    if (data.text) {
      const cur = inputEl.value.trim();
      inputEl.value = (cur ? cur + " " : "") + data.text.trim();
      inputEl.focus();
      toast("转写完成，可编辑后发送");
    } else {
      toast("转写失败：" + (data.error || "无结果"));
    }
    return;
  }
  // 附件选择完成：原生把元数据回传（可能无活跃 AI 轮，须在 currentAi 判空前处理）
  if (event === "attachments_picked") {
    const list = data.attachments || data.list || [];
    addAttachments(list);
    if (list.length) toast("已添加 " + list.length + " 个附件");
    return;
  }
  if (event === "attachment_error") {
    toast("附件处理失败：" + (data.message || "未知错误"));
    return;
  }
  // 系统 TTS 不可用，已回退到在线语音合成（提示，非错误）
  if (event === "tts_notice") {
    toast(data.message || "系统文字转语音不可用，已改用在线语音合成");
    return;
  }
  // 朗读失败（text_to_speech 合成/播放出错）
  if (event === "tts_error") {
    toast("朗读失败：" + (data.error || "语音合成失败"));
    return;
  }
  // 朗读结束（正常播放完/出错/被停止）：复位朗读按钮高亮
  if (event === "tts_done") {
    setTtsSpeakingIdx(null);
    return;
  }
  // 别端发起的流：本端没有气泡承载 → 先建气泡实时跟上（多端同步）。
  // 仅在历史已就绪时生效：冷加载/切会话重建期间不抢建，等 onHistory(resume) 确定性恢复。
  if (!currentAi && historyLoaded &&
      (event === "content" || event === "thinking" || event === "content_replace" ||
       event === "thinking_replace" || event === "tool_call_start" || event === "message_id")) {
    attachForeignStreamBubble();
  }
  if (!currentAi) return;

  if (event === "pow") {
    powEl.style.display = "flex";
    const pct = data.total > 0 ? Math.min(100, Math.round((data.tried * 100) / data.total)) : 0;
    powText.textContent = "算力校验中… " + pct + "%";
    powBar.style.width = pct + "%";
  } else if (event === "tool_call_start") {
    // 工具调用开始：立即创建「待返回」气泡（灰色），不等执行完毕。
    const callId = data.id || "";
    const tc = document.createElement("div");
    tc.className = "tool-call";
    tc.innerHTML = renderToolCallCard(data.name, data.arguments, "", "pending");
    tc.addEventListener("click", () => tc.classList.toggle("collapsed"));
    tc.classList.add("collapsed");
    if (callId) currentAi.state.toolCallCards[callId] = tc;
    currentAi.state.toolCallEntries.push({ id: callId, name: data.name || "", result: "" });
    // 线性渲染：把卡片插到「当前文本段（工具调用前的文本）」之后，
    // 并在卡片之后新建一个文本段承接后续回复（文本1 → 卡片 → 文本2 …）。
    if (currentAi.state.curThinkBlock && !currentAi.state.curThinkBlock.done) {
      currentAi.state.curThinkBlock.done = true;
    }
    const seg = currentAi.state.curSeg;
    renderCurSeg(currentAi.state);  // 固化前置文本段（已剥离 tool_calls）
    seg.el.parentNode.insertBefore(tc, seg.el.nextSibling);
    const newSegEl = document.createElement("div");
    seg.el.parentNode.insertBefore(newSegEl, tc.nextSibling);
    const newSeg = { el: newSegEl, raw: "" };
    currentAi.state.segs.push(newSeg);
    currentAi.state.curSeg = newSeg;
    currentAi.state.contentEl = newSegEl;  // 兼容其他引用
    currentAi.state.hadToolCall = true;
    scrollToBottom();
  } else if (event === "tool_call") {
    powEl.style.display = "none";
    // 工具执行完毕：按 id 找到 tool_call_start 创建的「待返回」气泡，填充结果并着色
    const resultText = extractToolResultText(data.result);
    const tcState = (isToolError(resultText) || data.error) ? "error" : "ok";
    const callId = data.id || "";
    const existing = callId ? currentAi.state.toolCallCards[callId] : null;
    if (existing) {
      // 一一对应：更新已有气泡（避免重复卡片），填结果 + 绿/红着色
      existing.innerHTML = renderToolCallCard(data.name, data.arguments, resultText, tcState);
      const entry = currentAi.state.toolCallEntries.find(e => e.id === callId);
      if (entry) entry.result = resultText;
      // 收集本轮文件改动（供气泡末尾「本次修改汇总」使用）
      trackFileChange(currentAi.state, data.name, data.arguments, resultText);
      scrollToBottom();
    } else {
      // 无 start 事件（旧流程/事件漏发）：退化为新建已完成卡片 + 段操作
      trackFileChange(currentAi.state, data.name, data.arguments, resultText);
      const tc = document.createElement("div");
      tc.className = "tool-call";
      tc.innerHTML = renderToolCallCard(data.name, data.arguments, resultText, tcState);
      tc.addEventListener("click", () => tc.classList.toggle("collapsed"));
      tc.classList.add("collapsed");
      currentAi.state.toolCallEntries.push({ id: callId, name: data.name || "", result: resultText });
      if (currentAi.state.curThinkBlock && !currentAi.state.curThinkBlock.done) {
        currentAi.state.curThinkBlock.done = true;
      }
      const seg = currentAi.state.curSeg;
      renderCurSeg(currentAi.state);  // 固化前置文本段（已剥离 tool_calls）
      seg.el.parentNode.insertBefore(tc, seg.el.nextSibling);
      const newSegEl = document.createElement("div");
      seg.el.parentNode.insertBefore(newSegEl, tc.nextSibling);
      const newSeg = { el: newSegEl, raw: "" };
      currentAi.state.segs.push(newSeg);
      currentAi.state.curSeg = newSeg;
      currentAi.state.contentEl = newSegEl;  // 兼容其他引用
      currentAi.state.hadToolCall = true;
      scrollToBottom();
    }
  } else if (event === "ask_user") {
    // 工具 ask_user 弹窗：等待用户输入（支持单/多问题、多选、标题+描述列表）
    powEl.style.display = "none";
    renderAskUser(data);
    $("askModal").style.display = "flex";
    scrollToBottom();
  } else if (event === "thinking") {
    powEl.style.display = "none";
    if (currentAi.state.hadToolCall) {
      // 工具续聊轮的思考：线性渲染到工具卡片之后的独立思考块
      renderLinearThink(currentAi.state, data.delta);
    } else {
      currentAi.state.thinkRaw += data.delta;
      currentAi.thinkRender();
      currentAi.thinkEl.classList.remove("collapsed");
    }
    // 实时累计思考 token，使圆环随思考过程动态增长
    liveStreamTokens += estimateTextTokens(data.delta);
    refreshTokenView();
    scrollToBottom();
  } else if (event === "content") {
    powEl.style.display = "none";
    if (currentAi.state.thinkRaw === "" && currentAi.state.contentRaw === "") {
      currentAi.thinkEl.style.display = "none";
    }
    // 续聊轮思考结束、正文开始：关闭当前线性思考块，后续 thinking 属新一轮
    if (currentAi.state.curThinkBlock && !currentAi.state.curThinkBlock.done) {
      currentAi.state.curThinkBlock.done = true;
    }
    currentAi.state.contentRaw += data.delta;
    currentAi.state.curSeg.raw += data.delta;
    // 实时累计输出 token，使圆环随正文生成动态增长（非静态）
    liveStreamTokens += estimateTextTokens(data.delta);
    refreshTokenView();
    currentAi.contentRender();
    // 思考完成自动折叠（在正文开始的第一帧触发，此时思考已结束）
    if (currentAi.state.thinkRaw.trim() !== "" && currentAi.thinkEl.style.display !== "none") {
      currentAi.thinkEl.classList.add("collapsed");
    }
    scrollToBottom();
  } else if (event === "content_replace") {
    // 站点整段重渲染：新文本不是旧基准的前缀，增量无法表达「改写」，
    // 原生层改发全文——这里整体覆盖当前段（而非追加），避免缺字。
    powEl.style.display = "none";
    if (currentAi.state.curThinkBlock && !currentAi.state.curThinkBlock.done) {
      currentAi.state.curThinkBlock.done = true;
    }
    // 工具续聊轮正文被工具卡片拆成多段，整段覆盖会毁掉分段结构：
    // 此时只同步 contentRaw（供导出/复制），渲染交给各段。
    if (currentAi.state.hadToolCall) {
      currentAi.state.contentRaw = data.full;
    } else {
      currentAi.state.contentRaw = data.full;
      currentAi.state.curSeg.raw = data.full;
      currentAi.contentRender();
    }
    if (currentAi.state.thinkRaw.trim() !== "" && currentAi.thinkEl.style.display !== "none") {
      currentAi.thinkEl.classList.add("collapsed");
    }
    scrollToBottom();
  } else if (event === "thinking_replace") {
    // 思考区整段重渲染：同样覆盖而非追加
    if (currentAi.state.hadToolCall) {
      // 工具续聊轮：思考渲染在线性块里，改写当前块原文并重渲染
      const tb = currentAi.state.curThinkBlock;
      if (tb) { tb.raw = data.full; scheduleMarkdown(tb.body, () => tb.raw); }
    } else {
      currentAi.state.thinkRaw = data.full;
      currentAi.thinkRender();
    }
    scrollToBottom();
  } else if (event === "done") {
    // done 携带**最终全文**（服务端权威）。用它无条件对齐气泡。
    //
    // 为什么必须无条件：驱动层（WebAutomationDriverImpl）只推送「前缀增长」的后缀增量——
    // 站点整段重渲染时（Markdown 标记回改 `**` 配对、列表符补全、代码高亮重排、
    // 思考区折叠）新文本不再是旧基准的前缀，那一轮增量被整体跳过；而 delta 累加模型
    // 无法表达「替换」，于是气泡缺字，磁盘却因 Done 的全文而完整。
    // 此前这里只在 foreignJoinedStream（中途加入别端流）时才用全文修正，
    // 本端自发的流永远拿不到这次修正 —— 正是「写盘完整、气泡缺字」的直接原因。
    if (data && typeof data.content === "string" && data.content) {
      // 工具续聊轮：正文被工具卡片拆成多段（segs），整段覆盖会毁掉分段结构，
      // 故只同步 contentRaw（供导出/复制），渲染交给各段；
      // 单段正文（含中途加入的别端流）直接整段覆盖并重渲染。
      if (foreignJoinedStream || !currentAi.state.hadToolCall) {
        currentAi.state.contentRaw = data.content;
        if (currentAi.state.curSeg) currentAi.state.curSeg.raw = data.content;
        if (typeof currentAi.contentRender === "function") currentAi.contentRender();
        else setMarkdown(currentAi.contentEl, stripToolCalls(data.content));
      } else {
        currentAi.state.contentRaw = data.content;
        // 工具续聊轮：正文被工具卡片拆成多段。流式后端有 content 增量事件逐段填充，
        // 这里只同步 contentRaw 即可；但**非流式后端（Web 自动化）不发 content 事件**——
        // 若同样只存不渲染，各段永远是空的，气泡正文空白（写盘却完整）。
        // 判据：本端自发流 + 当前段还没有任何内容（无增量来源）时，用 done 全文补渲染。
        if (!foreignJoinedStream && currentAi.state.curSeg &&
            !currentAi.state.curSeg.raw && currentAi.state.curSeg.el) {
          currentAi.state.curSeg.raw = data.content;
          renderCurSeg(currentAi.state);
        }
      }
    }
    // 思考内容同理：done 的 thinking 是完整思考，修正流式期间可能的缺字
    if (data && typeof data.thinking === "string" && data.thinking &&
        !currentAi.state.hadToolCall) {
      currentAi.state.thinkRaw = data.thinking;
      if (typeof currentAi.thinkRender === "function") currentAi.thinkRender();
    }
    foreignJoinedStream = false;
    powEl.style.display = "none";
    hideBanner();
    busy = false; sendBtn.disabled = false; inputEl.disabled = false;
    sendBtn.textContent = "发送"; sendBtn.classList.remove("stopping");
    if (currentAi.state.contentRaw.trim() === "" && currentAi.state.thinkRaw.trim() === "" && !currentAi.state.hadToolCall) {
      currentAi.contentEl.innerHTML = '<span style="color:var(--md-color)">（无文字回复，请重试）</span>';
    }
    // 思考完成后自动折叠思考块
    if (currentAi.state.thinkRaw.trim() !== "" && currentAi.thinkEl.style.display !== "none") {
      currentAi.thinkEl.classList.add("collapsed");
    }
    // 线性思考块（工具续聊轮）同样自动折叠
    (currentAi.state.thinkBlocks || []).forEach((tb) => {
      if (tb.raw && tb.raw.trim() !== "") tb.el.classList.add("collapsed");
    });
    // 兜底：服务端未回传 message_id 时这两个标记不会被 assignMessageIds 消费，
    // 必须在这里清掉，否则会污染下一轮普通发送的 id 回填。
    // 气泡结束：在末尾追加「本次修改汇总」（默认折叠）
    renderModSummary(currentAi.state, currentAi.row.querySelector(".content"));
    pendingRegen = null; pendingEditIds = null;
    currentAi = null;
    purgeDeadMessages();
  } else if (event === "error") {
    powEl.style.display = "none";
    hideBanner();
    busy = false; sendBtn.disabled = false; inputEl.disabled = false;
    sendBtn.textContent = "发送"; sendBtn.classList.remove("stopping");
    if (pendingRegen) {
      // 重新生成失败：作废这个空壳气泡并恢复原回复，避免树上多出一个无 id 的悬挂节点
      const e = messages[currentAi.row.dataset.regIdx];
      if (e) e.dead = true;
      if (pendingRegen.oldRow) pendingRegen.oldRow.style.display = "";
      pendingRegen = null;
      currentAi = null;
      recomputeVisibility();
      purgeDeadMessages();
      toast("重新生成失败：" + (data.message || "未知错误"));
      return;
    }
    if (pendingEditIds) {
      // 编辑重发失败：作废本轮新增的「改后提问 + 空回复」两条，恢复原提问
      const ai = messages[currentAi.row.dataset.regIdx];
      if (ai) ai.dead = true;
      const u = messages[ai ? ai.idx - 1 : -1];
      if (u && u.role === "user") u.dead = true;
      if (pendingEditIds.oldRow) pendingEditIds.oldRow.style.display = "";
      pendingEditIds = null;
      currentAi = null;
      recomputeVisibility();
      purgeDeadMessages();
      toast("编辑重发失败：" + (data.message || "未知错误"));
      return;
    }
    currentAi.contentEl.innerHTML = '<span class="err">' + escapeHtml(data.message || "未知错误") + "</span>";
    currentAi = null;
    purgeDeadMessages();
  } else if (event === "stopped") {
    // 用户主动停止：气泡保留已生成内容，按钮复位为「发送」
    powEl.style.display = "none";
    hideBanner();
    busy = false; sendBtn.disabled = false; inputEl.disabled = false;
    sendBtn.textContent = "发送"; sendBtn.classList.remove("stopping");
    // 思考内容自动折叠
    if (currentAi && currentAi.state.thinkRaw.trim() !== "" && currentAi.thinkEl.style.display !== "none") {
      currentAi.thinkEl.classList.add("collapsed");
    }
    // 重新生成/编辑被中途停止：服务端已生成的那条消息 id 拿不到了，
    // 保留这条半截气泡、旧节点维持隐藏，下次加载历史时以服务端消息树为准自愈。
    // 气泡结束（主动停止）：同样在末尾追加「本次修改汇总」
    renderModSummary(currentAi.state, currentAi.row.querySelector(".content"));
    pendingRegen = null; pendingEditIds = null;
    currentAi = null;
    purgeDeadMessages();
  } else if (event === "message_id") {
    // 助手消息 id：回填本轮气泡的 id / parent，维持对话树。
    // DeepSeek 后端来自服务端 SSE；OpenAI 兼容后端由原生层本地合成后回传（同一事件、同一语义）。
    assignMessageIds(data.id);
  } else if (event === "truncate") {
    // 编辑重发 / 重新生成：原生层已把本地历史截断到锚点之前，
    // 这里把锚点及其之后的旧气泡标 dead（恒隐藏且不参与消息树），
    // 否则会看到「新回复插在中间、旧尾巴还挂在下头」，直到切走再切回才恢复。
    // 用 dead 标记而非 splice：messages 的下标就是 row.dataset.regIdx，
    // 直接删元素会让之后所有气泡的 regIdx 全部错位。
    const from = messages.findIndex(m => m.id != null && String(m.id) === String(data.id));
    if (from >= 0) {
      for (let i = from; i < messages.length; i++) {
        // 本轮正在生成的新气泡（id 尚未分配）必须保留，不能连带作废
        if (messages[i].id == null) continue;
        messages[i].dead = true;
      }
      recomputeVisibility();
    }
  }
};

// ── /skill 输入建议 ──
const skillSuggest = $("skillSuggest");
let skillList = [];
let selectedSuggestion = -1;

// 加载技能列表（缓存）
function loadSkills() {
  try {
    const raw = window.ChatBridge.listSkills();
    const skills = JSON.parse(raw);
    skillList = [
      ...skills,
      { name: "system", description: "重发系统提示词" }
    ];
  } catch (e) {
    skillList = [
      { name: "system", description: "重发系统提示词" }
    ];
  }
}

inputEl.addEventListener("input", () => {
  const val = inputEl.value;
  const slashIdx = val.indexOf("/");
  if (slashIdx === 0 && val.length > 1) {
    // 输入 / 后显示技能建议
    const afterSlash = val.substring(1).toLowerCase();
    const matches = skillList.filter(s => s.name.toLowerCase().includes(afterSlash));
    if (matches.length > 0) {
      skillSuggest.innerHTML = matches.map((s, i) =>
        `<div class="item${i === selectedSuggestion ? " selected" : ""}" data-idx="${i}">` +
          `<span>/skill ${s.name}</span>` +
          `<span class="hint">${escapeHtml(s.description || "")}</span>` +
        `</div>`
      ).join("");
      skillSuggest.style.display = "block";
      skillSuggest.querySelectorAll(".item").forEach(el => {
        el.addEventListener("click", () => {
          const name = skillList[parseInt(el.dataset.idx)].name;
          inputEl.value = (name === "system" ? "/system" : "/skill " + name) + " ";
          skillSuggest.style.display = "none";
          inputEl.focus();
        });
      });
    } else {
      skillSuggest.style.display = "none";
    }
  } else if (val === "/") {
    // 刚输入 /，还没输任何字符，显示全部
    if (skillList.length > 0) {
      skillSuggest.innerHTML = skillList.map((s, i) =>
        `<div class="item${i === selectedSuggestion ? " selected" : ""}" data-idx="${i}">` +
          `<span>/skill ${s.name}</span>` +
          `<span class="hint">${escapeHtml(s.description || "")}</span>` +
        `</div>`
      ).join("");
      skillSuggest.style.display = "block";
      skillSuggest.querySelectorAll(".item").forEach(el => {
        el.addEventListener("click", () => {
          const name = skillList[parseInt(el.dataset.idx)].name;
          inputEl.value = (name === "system" ? "/system" : "/skill " + name) + " ";
          skillSuggest.style.display = "none";
          inputEl.focus();
        });
      });
    }
  } else {
    skillSuggest.style.display = "none";
  }
});

// 键盘导航
inputEl.addEventListener("keydown", (e) => {
  if (skillSuggest.style.display !== "block") {
    if (e.key === "Enter" && !isMobile && !e.shiftKey) {
      e.preventDefault();
      if (busy) {
        try { window.ChatBridge.stopGeneration(); } catch (ex) { toast("停止失败：" + ex.message); }
      } else send();
    }
    return;
  }
  const items = skillSuggest.querySelectorAll(".item");
  if (items.length === 0) return;
  if (e.key === "ArrowDown") {
    e.preventDefault();
    selectedSuggestion = (selectedSuggestion + 1) % items.length;
    items.forEach((el, i) => el.classList.toggle("selected", i === selectedSuggestion));
    items[selectedSuggestion]?.scrollIntoView({ block: "nearest" });
  } else if (e.key === "ArrowUp") {
    e.preventDefault();
    selectedSuggestion = (selectedSuggestion - 1 + items.length) % items.length;
    items.forEach((el, i) => el.classList.toggle("selected", i === selectedSuggestion));
    items[selectedSuggestion]?.scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault();
    // 若已选择建议项则使用，否则关闭面板直接发送（手动输入完整 /skill <name> 时）
    if (selectedSuggestion >= 0 && selectedSuggestion < items.length) {
      items[selectedSuggestion]?.click();
    } else {
      skillSuggest.style.display = "none";
      send();
    }
  } else if (e.key === "Escape") {
    skillSuggest.style.display = "none";
  }
});

// ── 附件上传：选择 / 展示 / 清空 ─────────────────────────────
// 点「附件」按钮：请求原生拉起系统文件选择器（多选任意文件）
attachBtn.addEventListener("click", () => {
  try { window.ChatBridge.pickAttachments(); }
  catch (e) { toast("无法打开文件选择器：" + e.message); }
});

// 原生选择完成后回传附件元数据：追加到待发送列表并渲染附件条
function addAttachments(list) {
  for (const a of (list || [])) {
    if (!a || !a.path) continue;
    pendingAttachments.push({ path: a.path, name: a.name || "附件", mime: a.mime || "", kind: a.kind || "other", preview: a.preview || "" });
  }
  renderAttachmentBar();
}

// 清空待发送附件（发送成功后 / 「clear」切换会话时调用）
function clearAttachments() {
  pendingAttachments = [];
  renderAttachmentBar();
}

// 渲染待发送附件条（薄片：小图预览 / 文件名 / 移除按钮）
function renderAttachmentBar() {
  attachBarEl.innerHTML = "";
  let html = "";
  pendingAttachments.forEach((a, i) => {
    const thumb = a.preview
      ? `<img src="${a.preview}" alt="">`
      : "";
    html += `<span class="chip" data-i="${i}">${thumb}<span class="c-name">${escapeHtml(a.name)}</span><span class="c-x" data-i="${i}" title="移除">✕</span></span>`;
  });
  attachBarEl.innerHTML = html;
  attachBarEl.classList.toggle("show", pendingAttachments.length > 0);
}

// 附件条移除按钮（事件委托）
attachBarEl.addEventListener("click", (e) => {
  const x = e.target.closest(".c-x");
  if (!x) return;
  const i = parseInt(x.dataset.i, 10);
  if (!Number.isNaN(i) && i >= 0 && i < pendingAttachments.length) {
    pendingAttachments.splice(i, 1);
    renderAttachmentBar();
  }
});

// 当前正在朗读的消息 idx（TTS 输出同一时刻仅一路）；null 表示未在朗读
let ttsSpeakingIdx = null;

// 更新「朗读」按钮高亮：同一时刻仅一个气泡处于播放态
function setTtsSpeakingIdx(idx) {
  document.querySelectorAll(".read-aloud.playing").forEach((b) => b.classList.remove("playing"));
  ttsSpeakingIdx = idx;
  if (idx != null) {
    const row = document.querySelector('.row[data-regIdx="' + idx + '"]');
    if (row) { const b = row.querySelector(".read-aloud"); if (b) b.classList.add("playing"); }
  }
}

// 气泡底部「朗读」按钮（事件委托）：点击朗读，重复点击停止；TTS 播放结束自动复位
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".read-aloud");
  if (!btn) return;
  const row = btn.closest(".row");
  if (!row) return;
  const idx = parseInt(row.dataset.regIdx, 10);
  const entry = messages[idx];
  const text = entry ? getEntryText(entry).trim() : "";
  if (!text) { toast("暂无可朗读的内容"); return; }

  // 重复点击同一气泡：停止朗读并释放 TTS（不占用）
  if (ttsSpeakingIdx === idx) {
    setTtsSpeakingIdx(null);
    try { window.ChatBridge.stopAudio(); } catch (err) {}
    return;
  }

  // 开始朗读
  setTtsSpeakingIdx(idx);
  try { window.ChatBridge.speak(text); }
  catch (err) { toast("朗读失败：" + err.message); setTtsSpeakingIdx(null); }
});

// ── 发送 ──
function send() {
  if (busy) return;
  const prompt = inputEl.value.trim();
  const atts = pendingAttachments.slice();   // 本次发送的附件快照
  if (!prompt && atts.length === 0) return;
  // 编辑重发只走 edit_message 原位分叉通道；附件会退回「追加到对话末尾」的普通通道，
  // 与已设置的 pendingEditIds / 隐藏 oldRow 冲突（前端按原位回填 id、后端却追加到尾部），拦截并提示
  if (pendingEdit && atts.length > 0) {
    toast("编辑重发暂不支持携带附件：请先取消编辑，或移除附件后再发送");
    return;
  }

  // ── /system 命令：重发系统提示词 ──────────────────────────────
  if (prompt === "/system") {
    try {
      window.ChatBridge.resendSystemPrompt();
      toast("✅ 系统提示词已重置，下一条消息将重新注入");
    } catch (e) {
      toast("❌ 操作失败：" + e.message);
    }
    inputEl.value = "";
    return;
  }

  hideBanner();
  inputEl.value = "";
  if (atts.length) clearAttachments();   // 附件随消息发送后清空附件条

  // 编辑重发：本次发送要走 edit_message 通道，并把新气泡挂到被编辑消息的父节点下
  const editing = pendingEdit;
  if (editing) {
    pendingEdit = null;
    cancelEdit();                       // 收起编辑提示条（状态已转存到 editing）
    editing.oldRow.style.display = "none";   // 旧提问属另一分支，先隐藏
  }
  addUserBubble(prompt, atts);
  currentAi = addAssistantBubble();
  if (editing) pendingEditIds = editing;   // 交给 assignMessageIds 回填分叉父
  busy = true; inputEl.disabled = true;
  // 发送进行中：按钮保持可点击，仅切换为「停止」态（点击即调用原生 stopGeneration）；
  // 不再禁用按钮，否则无法点击停止。重复发送由 busy 标志在 send() 内拦截。
  sendBtn.textContent = "停止"; sendBtn.classList.add("stopping");

  try {
    if (editing && atts.length === 0) {
      // 「编辑重发」：走服务端 /chat/edit_message，以被编辑消息 id 为锚点原位分叉，
      // 而不是把新文案当普通消息追加到对话末尾。
      window.ChatBridge.editMessage(editing.messageId, prompt,
                                    $("think").checked, $("search").checked);
      return;
    }
    // 「编辑重发」旧路径（无 id 兜底）：把下一次发送的父锚点重定向到被编辑消息的父，开新分支
    // （根节点 parentId 为 null → 显式清空锚点；其余情况重定向到指定父）
    if (pendingParentForNext != null) {
      try { window.ChatBridge.setParentMessageId(pendingParentForNext); } catch (e) {}
      pendingParentForNext = null;
    } else if (clearParentForNext) {
      try { window.ChatBridge.setParentMessageId(null); } catch (e) {}
      clearParentForNext = false;
    }
    if (atts.length) {
      const payload = atts.map(a => ({ path: a.path, name: a.name, mime: a.mime, kind: a.kind }));
      window.ChatBridge.sendMessageWithAttachments(prompt, $("think").checked, $("search").checked, JSON.stringify(payload));
    } else {
      window.ChatBridge.sendMessage(prompt, $("think").checked, $("search").checked);
    }
  } catch (e) {
    if (editing) { cancelEdit(); pendingEdit = null; }
    currentAi.contentEl.innerHTML = '<span class="err">发送失败：' + escapeHtml(e.message) + '（查看日志了解更多）</span>';
    busy = false; inputEl.disabled = false;
    sendBtn.textContent = "发送"; sendBtn.classList.remove("stopping");
    currentAi = null;
  }
}

// 点击发送/停止按钮：busy 时触发停止，否则发送
sendBtn.addEventListener("click", () => {
  if (busy) {
    try { window.ChatBridge.stopGeneration(); } catch (e) {
      toast("停止失败：" + e.message);
      busy = false; inputEl.disabled = false;
      sendBtn.textContent = "发送"; sendBtn.classList.remove("stopping");
    }
  } else send();
});

// ── 语音输入闭环：点击麦克风开始录音，再点一次停止并转写，转写文本回填输入框 ──
function setMicUI() {
  micBtn.classList.toggle("recording", recording);
  micBtn.classList.toggle("pending", micPending);
  micBtn.classList.toggle("busy", micBusy);
  micBtn.disabled = micBusy;
  micBtn.title = micBusy ? "正在转写…"
    : recording ? "点击停止并转写"
    : micPending ? "等待麦克风授权…" : "语音输入";
}

micBtn.addEventListener("click", () => {
  if (micBusy) return;
  if (recording) stopRecordingAndTranscribe();
  else startRecording();
});

function startRecording() {
  let res = {};
  try { res = JSON.parse(window.ChatBridge.startRecording() || "{}"); }
  catch (e) { toast("录音失败：" + e.message); return; }
  if (res.status === "recording") {
    recording = true; micPending = false;
    setMicUI();
  } else if (res.status === "pending") {
    micPending = true;
    setMicUI();
  } else {
    toast("录音失败：" + (res.message || "未知错误"));
  }
}

function stopRecordingAndTranscribe() {
  recording = false; micPending = false;
  setMicUI();
  let path = null;
  try {
    const res = JSON.parse(window.ChatBridge.stopRecording() || "{}");
    if (res.status !== "stopped" || !res.path) {
      toast("录音停止失败：" + (res.message || "无录音"));
      return;
    }
    path = res.path;
  } catch (e) { toast("录音停止失败：" + e.message); return; }

  micBusy = true; setMicUI();
  toast("正在转写…");
  try {
    window.ChatBridge.transcribeAudio(path);   // 异步：结果经 transcribed 事件回传
  } catch (e) {
    micBusy = false; setMicUI();
    toast("转写失败：" + e.message);
  }
}

function cancelRecordingIfAny() {
  if (!recording && !micPending) return;
  recording = false; micPending = false;
  setMicUI();
  try { window.ChatBridge.cancelRecording(); } catch (e) {}
}

// ── 长按交还 WebView 原生文本选区：长按消息即弹出系统自带拖动手柄 + 选区操作条（可复制）──
// 不再拦截长按弹自定义菜单；「重新生成 / 编辑重发 / 复制」改由气泡右上角「⋯」按钮触发（见 addRowMenu）。
// 桌面端如需右键菜单，可另接；移动端长按只产生原生选区，无需此处干预。
// 全局复制守卫：整页默认禁止复制；两种例外 ——
//  1) copyAllowed：显式「复制 / 选择文本」放行
//  2) 当前选区落在消息气泡(.row)内：对应「选择文本」后由原生选择复制
document.addEventListener("copy", (e) => {
  if (copyAllowed) return;
  const sel = window.getSelection();
  if (!sel || sel.type !== "Range" || !sel.toString().trim()) { e.preventDefault(); return; }
  let n = sel.anchorNode;
  const inRow = n && (n.nodeType === 3 ? n.parentElement.closest(".row") : (n.closest ? n.closest(".row") : null));
  if (!inRow) e.preventDefault();
});

// 清理消息注册表里的 dead 节点（重新生成/编辑截断留下的废弃气泡）：仅在无进行中轮次时执行，
// 移除 DOM + 重排下标 + 同步 row.dataset.regIdx（与删除路径同款的重编号，避免 regIdx 错位）。
function purgeDeadMessages() {
  if (busy || currentAi) return;
  if (!messages.some(m => m.dead)) return;
  const keep = [];
  for (let i = 0; i < messages.length; i++) {
    const m = messages[i];
    if (m.dead) {
      if (m.row && m.row.parentNode) m.row.parentNode.removeChild(m.row);
      continue;
    }
    keep.push(m);
  }
  const removed = messages.length - keep.length;
  if (removed <= 0) return;
  messages.length = 0;
  for (const m of keep) messages.push(m);
  messages.forEach((m, i) => { m.idx = i; if (m.row) m.row.dataset.regIdx = i; });
  recomputeVisibility();
}

// 气泡右上角「⋯」按钮：打开操作菜单（重新生成 / 编辑重发 / 复制）。
// 长按手势已交还给 WebView 原生文本选区（系统拖动手柄），故菜单改由此按钮触发，
// 避免「长按既想选词又想出菜单」的冲突。
function addRowMenu(row, bubble) {
  const btn = document.createElement("button");
  btn.className = "row-menu-btn";
  btn.type = "button";
  btn.textContent = "⋯";
  btn.setAttribute("aria-label", "更多操作");
  btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const r = btn.getBoundingClientRect();
    showCtxMenu(row, r.left, r.top);
  });
  bubble.appendChild(btn);
}

function showCtxMenu(row, x, y) {
  const idx = parseInt(row.dataset.regIdx, 10);
  const entry = messages[idx];
  if (!entry) return;
  // 清掉系统可能已拉起的选区，避免原生选择手柄与自定义菜单同时出现
  try { const s = window.getSelection(); if (s) s.removeAllRanges(); } catch (e) {}
  const menu = $("ctxMenu");
  const isUser = entry.role === "user";
  let html = "";
  if (isUser) html += '<div class="item" data-act="edit">编辑重发</div>';
  else html += '<div class="item" data-act="regen">重新生成</div>';
  // T5：从任意消息分叉出新会话（探索性多路径）
  html += '<div class="item" data-act="fork">从此处分支</div>';
  html += '<div class="sep"></div>';
  html += '<div class="item" data-act="copy">复制</div>';
  if (!isUser) html += '<div class="item" data-act="copyFull">复制(含工具)</div>';

$("ctxMenu").addEventListener("click", (e) => {
  const item = e.target.closest(".item");

// 点击别处或滚动时收起菜单
document.addEventListener("click", (e) => { if (!e.target.closest("#ctxMenu")) $("ctxMenu").style.display = "none"; });
messagesEl.addEventListener("scroll", () => { $("ctxMenu").style.display = "none"; });
// 用户主动拉起选区（文本选择器出来）时，收起自定义菜单，复制交给原生选择

function getEntryText(entry) {
  if (entry.role === "user") return entry.text || "";
  // AI：返回各文本段拼接（每段已剥离 tool_calls），即「渲染所见」的 Markdown 原文
  if (entry.state && entry.state.segs && entry.state.segs.length) {
    const text = entry.state.segs.map(s => stripToolCalls(s.raw)).join("");
    if (text) return text;
  }
  if (entry.state && entry.state.contentRaw) return stripToolCalls(entry.state.contentRaw);
  const c = entry.el.querySelector(".content");
  return c ? c.innerText : "";
}
function copyText(text) {
  if (!text) { toast("无内容可复制"); return; }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.top = "-9999px"; ta.style.left = "-9999px"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    copyAllowed = true;                         // 放行这一次复制
    const ok = document.execCommand("copy");
    copyAllowed = false;
    document.body.removeChild(ta);
    toast(ok ? "已复制" : "复制失败");
  } catch (e) { toast("复制失败"); }
}
function doCopy(entry) { copyText(getEntryText(entry).trim()); }

// 复制含工具结果的完整文本：文本段与工具调用记录按顺序交错拼接。
function getEntryTextFull(entry) {
  if (entry.role === "user") return entry.text || "";
  if (!entry.state) return getEntryText(entry);
  const parts = [];
  const segs = entry.state.segs || [];
  const tcs = entry.state.toolCallEntries || [];
  for (let i = 0; i < segs.length; i++) {
    const segText = stripToolCalls(segs[i].raw).trim();
    if (segText) parts.push(segText);
    if (i < tcs.length) {
      const tc = tcs[i];
      const label = tc.name ? "[调用工具: " + tc.name + "]" : "[工具结果]";
      parts.push(label + "\n" + (tc.result || "").trim());
    }
  }
  return parts.join("\n\n") || getEntryText(entry);
}

// ── 自建选词手柄 ───────────────────────────────────────────────────
// WebView 原生选区 ActionMode（那两个可拖动手柄）在本项目环境里不可靠地不弹出，
// 故用 Selection API 选中文本，并渲染两个可拖动圆点调整选区，配「复制」条。
let selActive = false;

const selHandleL = document.createElement("div");
const selHandleR = document.createElement("div");
selHandleL.className = "sel-handle sel-h-l";
selHandleR.className = "sel-handle sel-h-r";
document.body.appendChild(selHandleL);
document.body.appendChild(selHandleR);
const selCopyBar = document.createElement("div");
selCopyBar.className = "sel-copybar";
selCopyBar.innerHTML = '<span data-act="selcopy">复制</span>';
document.body.appendChild(selCopyBar);

function caretAt(x, y) {
  if (document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);

    const p = document.caretPositionFromPoint(x, y);
    if (p) { const r = document.createRange(); r.setStart(p.offsetNode, p.offset); r.collapse(true); return r; }
  }

}
function firstTextNode(root) {

  let n; while ((n = w.nextNode())) { if (n.nodeValue && n.nodeValue.trim().length) return n; }
  return null;
}
function hideSelUI() {
  selHandleL.style.display = "none";
  selHandleR.style.display = "none";
  selCopyBar.style.display = "none";
}
function positionSelHandles() {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) { hideSelUI(); return; }
  const rects = sel.getRangeAt(0).getClientRects();
  if (!rects.length) { hideSelUI(); return; }
  const start = rects[0], end = rects[rects.length - 1];
  selHandleL.style.display = "block";
  selHandleR.style.display = "block";
  selHandleL.style.left = start.left + "px";
  selHandleL.style.top = (start.bottom - 8) + "px";
  selHandleR.style.left = end.right + "px";
  selHandleR.style.top = (end.bottom - 8) + "px";
  const sr = sel.getRangeAt(0).getBoundingClientRect();
  selCopyBar.style.display = "block";
  let bx = sr.left + sr.width / 2 - 28;
  bx = Math.max(8, Math.min(bx, window.innerWidth - 72));
  let by = sr.top - 46; if (by < 8) by = sr.bottom + 10;
  selCopyBar.style.left = bx + "px";
  selCopyBar.style.top = by + "px";
}
function selSetBoundary(which, caret) {
  if (!caret) return;
  if (selRoot && !selRoot.contains(caret.startContainer)) return;   // 限定在本气泡内
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const r = sel.getRangeAt(0);
  if (which === "l") r.setStart(caret.startContainer, caret.startOffset);
  else r.setEnd(caret.startContainer, caret.startOffset);

function attachHandleDrag(handle, which) {

  handle.addEventListener("touchmove", (e) => {
    if (!handle._d) return;
    e.preventDefault(); e.stopPropagation();
    const t = e.touches[0];
    selSetBoundary(which, caretAt(t.clientX, t.clientY));
  }, { passive: false });
  handle.addEventListener("touchend", (e) => { handle._d = false; }, { passive: false });
}
attachHandleDrag(selHandleL, "l");
attachHandleDrag(selHandleR, "r");
// 手柄/复制条是 position:fixed，消息区滚动后必须跟着选区重新定位
messagesEl.addEventListener("scroll", () => { if (selActive) positionSelHandles(); }, { passive: true });
selCopyBar.addEventListener("click", (e) => {
  if (e.target.dataset.act !== "selcopy") return;
  const txt = window.getSelection().toString();
  copyText(txt.trim());

  selActive = false; selRoot = null; hideSelUI();
});
function startCustomSelect(el) {
  selActive = true; selRoot = el;
  const sel = window.getSelection();
  sel.removeAllRanges();
  const tn = firstTextNode(el);
  if (tn) {
    const s = tn.nodeValue.search(/\S/); const a = s < 0 ? 0 : s;
    let b = tn.nodeValue.indexOf(" ", a); if (b < 0) b = tn.nodeValue.length;
    const r = document.createRange(); r.setStart(tn, a); r.setEnd(tn, b);
    sel.addRange(r);
  }

// 选择文本：解锁该气泡，自建选词手柄（两个圆点拖动调整 + 复制条），不再依赖原生 ActionMode
function doSelect(entry) {
  const el = entry.el;
  el.style.userSelect = "text";
  el.style.webkitUserSelect = "text";
  el.style.webkitTouchCallout = "default";
  copyAllowed = true;                          // 放行该气泡内的手动复制
  selectModeRow = el.closest(".row");          // 该气泡长按不再弹菜单，避免与选词冲突
  setTimeout(() => {
    copyAllowed = false;
    if (selectModeRow === el.closest(".row")) selectModeRow = null;
  }, 15000);
  startCustomSelect(el);
  toast("拖动两端圆点调整选词，点「复制」完成拷贝");
}
// 重新生成：调用服务端 /chat/regenerate（child_message_id = 这条助手消息），
// 服务端会在同一提问下追加一个兄弟回复；前端只新增一条助手气泡，不重发 prompt、不新增用户气泡。
function doRegenerate(entry) {
  if (busy) return;
  if (entry.role !== "ai") { toast("只能重新生成助手回复"); return; }
  const cid = (entry.id != null && entry.id !== "null" && entry.id !== "") ? String(entry.id) : null;
  if (!cid) { toast("这条回复缺少服务端消息 id，无法重新生成"); return; }
  hideBanner();
  // 生成期间先隐藏旧回复，避免新旧两条同时显示；结束后由 recomputeVisibility 接管
  entry.row.style.display = "none";
  pendingRegen = { parentId: entry.parentId != null ? String(entry.parentId) : null, oldRow: entry.row };
  currentAi = addAssistantBubble();
  busy = true; inputEl.disabled = true;
  sendBtn.textContent = "停止"; sendBtn.classList.add("stopping");
  try {
    window.ChatBridge.regenerate(cid, $("think").checked, $("search").checked);
  } catch (e) {
    pendingRegen = null;
    entry.row.style.display = "";
    currentAi.contentEl.innerHTML = '<span class="err">重新生成失败：' + escapeHtml(e.message) + "</span>";
    busy = false; inputEl.disabled = false;
    sendBtn.textContent = "发送"; sendBtn.classList.remove("stopping");
    currentAi = null;
  }
}
// ── 编辑重发 ────────────────────────────────────────────────────
// 把原文填回输入框，进入「编辑中」态；点发送时走 /chat/edit_message，
// 以被编辑消息 id 为锚点在原位分叉，而不是把新文案追加到对话末尾。
function showEditBar(text) {
  let bar = $("editBar");

    bar = document.createElement("div");
    bar.id = "editBar";
    bar.innerHTML = '<span class="eb-t"></span><span class="eb-x">取消</span>';
    const inputRow = inputEl.parentElement;          // .input-row
    inputRow.parentElement.insertBefore(bar, inputRow);   // 插在 #composer 内、输入行上方
    bar.querySelector(".eb-x").addEventListener("click", () => {
      pendingEdit = null; inputEl.value = ""; cancelEdit();
    });
  }

function cancelEdit() {
  const bar = $("editBar");
  if (bar) bar.style.display = "none";
}
function doEditResend(entry) {
  if (busy) return;
  if (entry.role !== "user") { toast("只能编辑自己的提问"); return; }
  const mid = (entry.id != null && entry.id !== "null" && entry.id !== "") ? String(entry.id) : null;
  if (!mid) {
    // 兜底：这条消息还没拿到服务端 id（极少见），退回「改父锚点后当新消息发」的老路径
    const hasParent = entry.parentId && entry.parentId !== "null" && entry.parentId !== "";
    pendingParentForNext = hasParent ? String(entry.parentId) : null;
    clearParentForNext = !hasParent;
    inputEl.value = entry.text || "";
    setTimeout(() => inputEl.focus(), 0);
    return;
  }
  pendingEdit = {
    messageId: mid,
    parentId: entry.parentId != null ? String(entry.parentId) : null,
    oldRow: entry.row
  };
  inputEl.value = entry.text || "";
  showEditBar(entry.text || "");
  setTimeout(() => { inputEl.focus(); inputEl.select(); }, 0);
}
// T5：从当前消息分叉出新会话（同前置下的另一条探索路径）。
// 宿主（Tabs.onForkedSession）会在分叉成功后自动打开新会话窗口，前端无需额外切换。
function doFork(entry) {
  if (busy) { toast("请等待当前回复结束后再分支"); return; }
  const mid = (entry.id != null && entry.id !== "null" && entry.id !== "") ? String(entry.id) : null;
  if (!mid) { toast("该消息尚无稳定 id，无法分支（请先发送一次以生成 id）"); return; }
  let newSid = "";
  try {
    newSid = window.ChatBridge.forkSession(mid) || "";
  } catch (e) {
    toast("分支失败：" + (e && e.message ? e.message : e));
    return;
  }
  if (!newSid) { toast("分支失败：锚点无效，或当前后端不支持分叉（仅 OpenAI 兼容后端支持）"); return; }
  toast("已创建分支会话，正在切换…");
}
// ── ask_user 提交/取消 ──────────────────────────────────────
function submitAskUser(callId, response) {
  $("askModal").style.display = "none";
  askUserCallId = null;

    window.ChatBridge.submitUserInput(callId, response);
  } catch (e) {

// ── ask_user 增强渲染（多问题 / 多选 / 标题+描述列表）─────────────
let askQuestions = [];

// 解析选项：逗号分隔，每项「标题」或「标题|描述」
function parseOptions(str) {
  if (!str) return [];
  return str.split(",").map(s => {
    s = s.trim();
    if (!s) return null;
    const idx = s.indexOf("|");
    if (idx >= 0) return { title: s.slice(0, idx).trim(), description: s.slice(idx + 1).trim() };
    return { title: s, description: "" };
  }).filter(Boolean);
}

// 构建选项列表（单选 radio / 多选 checkbox）。
// 点击仅切换选中状态（radio 只选不反选），提交一律由底部「确定」按钮触发——
// 这样单问题/多问题、text/confirm/choice 各类型的交互完全一致，
// 也避免「点选项即提交」导致按钮来不及显示「确定」就被关闭。
function buildOptionList(opts, qi, multi) {
  const list = document.createElement("div");
  list.className = "am-option-list";
  opts.forEach((opt) => {
    const item = document.createElement("div");
    item.className = "am-opt";
    const input = document.createElement("input");
    input.type = multi ? "checkbox" : "radio";
    input.name = "askopt_" + qi;
    input.className = "am-opt-cb";
    input.dataset.qi = qi;
    input.dataset.val = opt.title;
    const body = document.createElement("div");
    body.className = "am-opt-body";
    const t = document.createElement("div"); t.className = "am-opt-title"; t.textContent = opt.title; body.appendChild(t);
    if (opt.description) {
      const d = document.createElement("div"); d.className = "am-opt-desc"; d.textContent = opt.description; body.appendChild(d);
    }
    item.appendChild(input);
    item.appendChild(body);
    item.addEventListener("click", (e) => {
      // 直接点原生 input 时交给浏览器默认行为，避免与下面的手动切换相互抵消
      if (e.target.tagName === "INPUT") return;
      // radio 单选：点击已选项不应反选（原生 radio 语义）
      input.checked = input.type === "radio" ? true : !input.checked;
      item.classList.toggle("am-opt-sel", input.checked);
      // 手动改 checked 不触发原生 change，这里补派发，让按钮文案实时联动
      input.dispatchEvent(new Event("change", { bubbles: true }));
    });
    // 原生点击 input（含键盘操作）也同步高亮态
    input.addEventListener("change", () => item.classList.toggle("am-opt-sel", input.checked));
    list.appendChild(item);
  });
  return list;
}

// 单个问题块（用于多问题模式），qi 为问题下标
function buildQuestionBlock(q, qi) {
  const block = document.createElement("div");
  block.className = "am-qblock";
  const label = document.createElement("div");
  label.className = "am-qlabel";
  label.textContent = q.question || "请回答：";
  block.appendChild(label);
  const type = q.type || "text";
  const multi = !!q.multi_select;
  if (type === "text") {
    block.appendChild(makeAskInput(qi));
  } else if (type === "confirm") {
    block.appendChild(buildOptionList([{ title: "是" }, { title: "否" }], qi, false));
    // 始终提供文本输入框兜底：选项之外可自由输入，避免选项不可用时无法作答
    block.appendChild(makeAskInput(qi));
  } else if (type === "choice" && q.options) {
    block.appendChild(buildOptionList(parseOptions(q.options), qi, multi));
    block.appendChild(makeAskInput(qi));
  } else {
    block.appendChild(makeAskInput(qi));
  }
  return block;
}

// 构造一个文本输入框（askText_<qi>），回车触发提交/关闭
function makeAskInput(qi) {
  const inp = document.createElement("input");
  inp.type = "text"; inp.id = "askText_" + qi; inp.className = "am-text-input";
  inp.placeholder = "输入回答…";
  inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); doAskSubmit(askUserCallId); } });
  return inp;
}

// 让某题的「选项」与「兜底输入框」互斥：输入框有内容则清空选项，选中选项则清空输入，提交只认其一
function linkAskInputOptions(qi) {
  const inp = $("askText_" + qi);
  const opts = () => document.querySelectorAll('#askModal .am-opt input[name="askopt_' + qi + '"]');
  const clearOpts = () => {
    opts().forEach((o) => { o.checked = false; const p = o.closest(".am-opt"); if (p) p.classList.remove("am-opt-sel"); });
  };
  const clearInput = () => { if (inp) inp.value = ""; };
  if (inp) {
    inp.addEventListener("input", () => { if (inp.value.trim() !== "") clearOpts(); });
  }
  // 选中任一选项即清空兜底输入框（输入框有内容则反向清选项，见上）。
  // buildOptionList 在点击选项主体时会手动派发 change，因此这里监听 change 即可，
  // 无需再挂 click（否则同一次点击会重复 clearInput）。
  opts().forEach((o) => {
    o.addEventListener("change", () => { if (o.checked) clearInput(); });
  });
}

// 单问题模式渲染（保留即时提交等原有行为）
function renderSingleQuestion(q, inputArea, callId, submitBtn) {
  const type = q.type || "text";
  const multi = !!q.multi_select;
  if (type === "text") {
    const inp = makeAskInput(0);
    inputArea.appendChild(inp); inp.focus();
    submitBtn.style.display = "block"; submitBtn.onclick = () => doAskSubmit(callId);
  } else if (type === "confirm") {
    // 确认：仅选中，由底部「确定」按钮统一提交
    inputArea.appendChild(buildOptionList([{ title: "是" }, { title: "否" }], 0, false));
    // 选项之外的兜底输入框：不选选项也可直接输入回答
    const inp = makeAskInput(0);
    inputArea.appendChild(inp);
    submitBtn.style.display = "block"; submitBtn.onclick = () => doAskSubmit(callId);
  } else if (type === "choice" && q.options) {
    const opts = parseOptions(q.options);
    if (multi) {
      inputArea.appendChild(buildOptionList(opts, 0, true));
      // 多选之外的兜底输入框
      inputArea.appendChild(makeAskInput(0));
      submitBtn.style.display = "block"; submitBtn.onclick = () => doAskSubmit(callId);
    } else {
      // 单选：仅选中，不自动提交；由底部「确定」按钮统一提交
      inputArea.appendChild(buildOptionList(opts, 0, false));
      // 单选之外的兜底输入框
      const inp = makeAskInput(0);
      inputArea.appendChild(inp);
      submitBtn.style.display = "block"; submitBtn.onclick = () => doAskSubmit(callId);
    }
  } else {
    const inp = makeAskInput(0);
    inputArea.appendChild(inp); inp.focus();
    submitBtn.style.display = "block"; submitBtn.onclick = () => doAskSubmit(callId);
  }
}

// 收集某个问题的答案：优先取选中的选项，未选中时回退到兜底输入框
function collectAnswer(qi, q) {
  const type = q.type || "text";
  const multi = !!q.multi_select;
  const inputVal = (() => {
    const inp = $("askText_" + qi);
    return inp ? inp.value.trim() : "";
  })();
  if (type === "text") return inputVal;
  if (type === "confirm" || (type === "choice" && !multi)) {
    const sel = document.querySelector('#askModal .am-opt input[name="askopt_' + qi + '"]:checked');
    return sel ? sel.dataset.val : inputVal;
  }
  if (type === "choice" && multi) {
    const checked = document.querySelectorAll('#askModal .am-opt input[name="askopt_' + qi + '"]:checked');
    const vals = Array.from(checked).map(c => c.dataset.val);
    return vals.length ? vals.join(", ") : inputVal;
  }
  return inputVal;
}

// 统一提交：多问题时拼接为「[序号] 问题 → 答案」格式。
// 若所有答案均为空（未选选项且输入框为空），不回报结果：仅关闭弹窗并通知原生层取消该调用。
function doAskSubmit(callId) {
  // 先收集「原始」答案（不含问题标题）。空判定必须基于它——
  // 曾把拼接后的 "问题\n答案" 拿去做空判定，问题标题本身就让字符串恒非空，
  // 于是一个都没答也走不到「取消」分支，反倒把 "[1] 问题\n\n[2] 问题\n" 这种空壳喂给模型。
  const raw = askQuestions.map((q, qi) => collectAnswer(qi, q));
  const anyFilled = raw.some((x) => x && x.trim() !== "");
  if (!anyFilled) {
    // 无任何输入：视为取消，不回报空答案（避免把空串当成用户回答喂给模型）
    closeAskUserAsCancel(callId);
    return;
  }
  // 有答案时，多问题才拼成「[序号] 问题 → 答案」格式。
  const response = askQuestions.length > 1
    ? raw.map((a, qi) => "[" + (qi + 1) + "] " + (askQuestions[qi].question || "问题" + (qi + 1)) + "\n" + a).join("\n\n")
    : (raw[0] || "");
  submitAskUser(callId, response);
}

// 关闭弹窗并通知原生层取消 ask_user 调用（complete deferred，避免挂起卡死）
function closeAskUserAsCancel(callId) {
  $("askModal").style.display = "none";
  askUserCallId = null;
  try { window.ChatBridge.submitUserInput(callId, "__cancel__"); } catch (e) {}
}

// 入口：根据 data 渲染 ask_user 弹窗
function renderAskUser(data) {
  const callId = data.id;

    ? Array.from(data.questions)
    : [{ question: data.question || "请回答：", type: data.type || "text", options: data.options || "", multi_select: !!data.multi_select }];
  askQuestions = list;
  const multi = list.length > 1;

  if (multi) {
    qEl.textContent = "请回答以下问题：";

  // 点击仅关闭弹窗不回报；有答案时恢复「确定」。
  // 三个事件都要监听：
  //   input  —— 文本框键入
  //   change —— 选项选中（buildOptionList 手动派发）

// 输入框实时估算 token（中文≈/2，其它≈/4，+12 基线）——与后端启发式一致
function estimateInputTokens(text) {
  if (!text) return 0;
  let cjk = 0, other = 0;
  for (const ch of text) {
    if (/[㐀-鿿　-〿＀-￯]/.test(ch)) cjk++; else other++;
  }
  return Math.round(cjk / 2 + other / 4 + 12);
}

// 纯按字符估算（无 +12 基线），用于增量累加每一次流式 delta，避免基线被重复计入
function estimateTextTokens(text) {
  if (!text) return 0;
  let cjk = 0, other = 0;
  for (const ch of text) {
    if (/[㐀-鿿　-〿＀-￯]/.test(ch)) cjk++; else other++;
  }
  return Math.round(cjk / 2 + other / 4);
}

// 当前"已使用"= 历史基线(lastPrompt) + 当前输入框未发送内容
function currentUsed() {
  // 当前占用 = 上一轮上下文基线 + 本轮流式输出实时估算 + 输入框未发送内容
  return lastPromptTokens + liveStreamTokens + estimateInputTokens(inputEl.value);
}

// 入口小圆环：仅展示已用占比（顺时针从顶部起，高危变红）
const MINI_R = 9;
const MINI_C = 2 * Math.PI * MINI_R;
function setMiniDonut(used, total) {
  const frac = total > 0 ? Math.max(0, Math.min(1, used / total)) : 0;
  const len = frac * MINI_C;
  miniArc.style.strokeDasharray = len.toFixed(2) + " " + (MINI_C - len).toFixed(2);
  miniArc.style.stroke = frac >= 0.95 ? "var(--danger)" : "#4285f4";
}

// 面板堆叠条（chat.html / chat_desktop.html 统一实现）：固定 左→右 = 已使用 → 安全余量(用量→阈值点) → 压缩阈值区(阈值点→窗口顶，0.8~1.0)。
// 压缩阈值区始终贴住条尾：用量未过阈值时完整显示 0.8~1.0 段；用量越过阈值后，蓝色
// “已使用”盖住压缩区头部，红色斜纹只保留尚未被占用的尾部——条永远填满、不再有空白尾段，
// 阈值起点由 .threshold-marker 红线固定（位置 = total×0.8 处，不随用量漂移）。
function setBar(u, thresholdPoint, total) {
  const p = (x) => total > 0 ? Math.max(0, Math.min(100, (x / total) * 100)) : 0;
  const used = Math.max(0, Math.min(u, total));
  const safe = Math.max(0, thresholdPoint - used);                  // 阈值点前的安全余量
  const comp = Math.max(0, total - Math.max(used, thresholdPoint));  // 压缩区内尚未占用的部分
  tokenBar.querySelector(".seg-used").style.width = p(used) + "%";
  tokenBar.querySelector(".seg-free").style.width = p(safe) + "%";
  tokenBar.querySelector(".seg-threshold").style.width = p(comp) + "%";
  const marker = tokenBar.querySelector(".threshold-marker");
  if (marker) marker.style.left = p(thresholdPoint) + "%";
}

// 更新 token 视图（used = 当前上下文占用）
function updateTokenView(used) {
  const total = TOKEN_CONFIG.total;
  // 后端尚未推送真实配置（total<=0）：不显示假数据，指标占位"—"
  if (total <= 0) {
    panelUsed.textContent = "—";
    panelFree.textContent = "—";
    setMiniDonut(0, 1);
    setBar(0, 0, 0, 1);
    tokenAlert.className = "token-alert";
    tokenAlert.textContent = "";
    return;
  }
  // 后端已推送配置（total>0）但尚无真实流水数据（lastPromptTokens=0）：
  // 不显示假数据 '0'，指标占位"—"，等待 pushTokenFlow 到达后刷新为真实值。
  // 避免 applyTokenConfig → refreshTokenView 在 pushTokenFlow 之前用 '0' 覆盖 '—'。
  if (used === 0 && lastPromptTokens === 0 && liveStreamTokens === 0) {
    panelUsed.textContent = "—";
    panelFree.textContent = "—";
    setMiniDonut(0, 1);
    setBar(0, 0, 0, 1);
    tokenAlert.className = "token-alert";
    tokenAlert.textContent = "";
    return;
  }
  // 压缩阈值点 = total × 0.8（对齐 ContextCompactor.DEFAULT_THRESHOLD_RATIO=0.8），
  // 即进度条 0.8~1.0 区间为预留/压缩区（纯视觉标记，无需后端数据源）。
  const thresholdPoint = Math.round(total * 0.8);
  const u = Math.max(0, Math.min(used, total));

  panelUsed.textContent = u.toLocaleString();
  panelFree.textContent = (total - u).toLocaleString();   // 实际可用 = 真实剩余

  setMiniDonut(u, total);
  setBar(u, thresholdPoint, total);

  tokenAlert.className = "token-alert";
  tokenAlert.textContent = "";
  const freeRatio = total > 0 ? (total - u) / total : 1;
  if (freeRatio < 0.05) {
    tokenAlert.classList.add("danger");
    tokenAlert.textContent = "高危：上下文即将超限，请清理会话";
  } else if (freeRatio < 0.20) {
    tokenAlert.classList.add("warn");
    tokenAlert.textContent = "警告：剩余上下文不足，建议清理历史消息";
  }
}

// 应用后端推送的配置（总上下文/模型）
function applyTokenConfig(cfg) {
  if (!cfg) return;
  // 始终展示入口圆环（用户可点击查看请求流水）；收到配置即刷新窗口/模型
  if (tokenPanelWrap) tokenPanelWrap.style.display = "block";
  // 0 = 未配置：清空旧值显示 “—”，避免残留上一次推送的总窗口（多源覆盖的根因之一）
  if (cfg.totalContext != null && cfg.totalContext >= 0) TOKEN_CONFIG.total = cfg.totalContext;
  if (cfg.model) {
    TOKEN_CONFIG.model = cfg.model;
    if (metricModel) metricModel.textContent = cfg.model;
  } else if (metricModel) {
    metricModel.textContent = "—";
  }
  // 后端标识：DeepSeek 逆向 SSE 只回传总数（accumulated_token_usage），prompt/completion
  // 拆分是本地推算，故「已使用」与「请求流水」的明细并非 provider 真实值，需明确标注。
  if (cfg.backend) TOKEN_CONFIG.backend = cfg.backend;
  const isDs = TOKEN_CONFIG.backend === "DEEPSEEK_REVERSE";
  if (usedNote) {
    usedNote.style.display = isDs ? "" : "none";
    usedNote.textContent = isDs ? "（拆分估算）" : "";
    usedNote.title = isDs ? "DeepSeek 只回传总 token 数，无 prompt/completion 拆分；此处输入/输出为本地推算" : "";
  }
  if (flowNote) {
    flowNote.style.display = isDs ? "" : "none";
    flowNote.textContent = isDs ? "（拆分估算）" : "";
    flowNote.title = isDs ? "DeepSeek 只回传总 token 数，逐条 prompt/completion 明细为本地推算" : "";
  }
  if (metricTotal) metricTotal.textContent = TOKEN_CONFIG.total > 0 ? TOKEN_CONFIG.total.toLocaleString() : "—";
  // 压缩阈值 = total × 0.8（前端自行计算，无需后端推送）
  if (metricReserved) metricReserved.textContent = TOKEN_CONFIG.total > 0 ? Math.round(TOKEN_CONFIG.total * 0.8).toLocaleString() : "—";
  refreshTokenView();
}

// 请求流水（对齐 deepseek-harness TurnTokenUsage：模型/未缓存/缓存读/输出(推理)/总计/命中率）
// 数字格式：概览用紧凑 (15.8K/1.2M)，明细悬浮用千分位（与 deepseek token-format.ts 一致）
function fmtCompact(v) {
  if (v == null || isNaN(v)) return "0";
  v = Math.max(0, Math.round(v));
  if (v < 1000) return String(v);
  if (v < 1_000_000) return (Math.round(v / 100) / 10) + "K";
  return (Math.round(v / 100000) / 10) + "M";
}
function fmtExact(v) {
  if (v == null || isNaN(v)) return "0";
  return Math.max(0, Math.round(v)).toLocaleString("en-US");
}
// 缓存命中率：cacheRead / prompt（对齐 deepseek formatCacheHitPercent，分母=输入侧）
function fmtHitPct(cacheRead, prompt) {
  if (!prompt || prompt <= 0) return "—";
  if (cacheRead >= prompt) return "100%";
  return (Math.round((cacheRead / prompt) * 1000) / 10).toFixed(1) + "%";
}

// 原始报文美化：请求为单条 JSON body；响应为多个 SSE data 帧（按行）拼接，逐帧美化后分段展示。
function prettyJson(s) {
  if (!s) return "";
  try { return JSON.stringify(JSON.parse(s), null, 2); } catch (_) { return s; }
}
function prettyJsonMulti(s) {
  if (!s) return "";
  return s.split("\n").map(function (line) {
    var t = line.trim();
    if (!t) return "";
    try { return JSON.stringify(JSON.parse(t), null, 2); } catch (_) { return t; }
  }).filter(Boolean).join("\n\n");
}

  const kv = (k, v) => `<div class="fd-kv"><span class="fd-k">${k}</span><b>${escapeHtmlForText(v)}</b></div>`;
  const textBlock = (title, val) =>
    `<div class="fd-grp"><div class="fd-grp-title">${title}</div>` +
    (val ? `<div class="fd-text"><span class="fd-copy-btn" data-copy="true">复制</span><span class="fd-text-content">${escapeHtmlForText(val)}</span></div>` : `<div class="fd-empty">（无）</div>`) +
    `</div>`;

  let catBlock = "";
  if (catTotal > 0) {
    const catRows = [
      ["系统提示词", catSystem], ["用户消息", catUser], ["工具请求", catToolRequest],
      ["工具响应", catToolResponse], ["工具列表", catTools],
      ["正文", catContent], ["思考", catThinking], ["其他", catOther]
    ].map(([name, val]) =>
      `<div class="fd-kv"><span class="fd-k">${name}</span><b>${val.toLocaleString()}</b></div>`
    ).join("");
    catBlock = `<div class="fd-grp"><div class="fd-grp-title">请求分类（${catTotal.toLocaleString()} tokens）</div>` +
      `<div class="fd-grid">${catRows}</div></div>`;
  }

  fdBody.innerHTML =
    `<div class="fd-grp"><div class="fd-grp-title">Token 用量</div><div class="fd-grid">` +
      kv("时间", item.timeStr) + kv("路由", item.route) +
      kv("未缓存", fmtExact(item.uncached)) + kv("缓存读", fmtExact(item.cacheRead)) +
      kv("输出", fmtExact(item.output) + (item.reasoning > 0 ? "（推理 " + fmtExact(item.reasoning) + "）" : "")) +
      kv("总计", fmtExact(item.total)) +
      kv("缓存命中", item.hitPct) + kv("状态", statusText) +
    `</div></div>` +
    catBlock +
    textBlock("请求（原始请求体 JSON）", prettyJson(reqText)) +
    textBlock("响应（原始 SSE 响应帧 JSON）", prettyJsonMulti(respText));

  flowDetailModal.classList.add("show");
}

document.getElementById("fdClose").addEventListener("click", () => flowDetailModal.classList.remove("show"));
flowDetailModal.addEventListener("click", (e) => {
  if (e.target === flowDetailModal) flowDetailModal.classList.remove("show");
});
// 委托：点击复制按钮复制请求/响应原始报文
fdBody.addEventListener("click", (e) => {
  const btn = e.target.closest(".fd-copy-btn");
  if (!btn) return;
  const textContent = btn.parentElement.querySelector(".fd-text-content");
  const text = textContent ? textContent.textContent : "";
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = "已复制";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "复制"; btn.classList.remove("copied"); }, 1500);
  }).catch(() => {
    btn.textContent = "复制失败";
    setTimeout(() => { btn.textContent = "复制"; }, 1500);
  });
});

// 委托：点击任意「查看」按钮打开对应详情
tokenLog.addEventListener("click", (e) => {
  const btn = e.target.closest(".log-view");
  if (btn) openFlowDetail(parseInt(btn.dataset.idx, 10));
});

function getTimeStr(ts) {
  const d = ts ? new Date(ts) : new Date();
  const p = n => n.toString().padStart(2, '0');
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

// 后端对接入口：Kotlin 每轮请求完成后推送真实 token 统计；流式过程中推送 status=ing 的实时预览（同 seq upsert）
// entry 字段（ChatBridge.tokenFlow）：route, prompt, uncachedInput, completion, reasoning, cacheHit(=cacheRead), total, cumulative, status, catSystem, catUser, catToolRequest, catToolResponse, catTools, catOther
function pushTokenFlow(entry) {
  if (!entry) return;
  const isLive = (entry.status === "ing");
  // 终态才刷新面板基线与累计：进行中预览不污染 lastPromptTokens / liveStreamTokens / cumulative
  if (!isLive) {
    lastPromptTokens = entry.prompt || 0;
    liveStreamTokens = 0; // 本轮真实用量已由 provider 上报，清零流式估算避免重复计入
    if (panelCum) panelCum.textContent = (entry.cumulative || 0).toLocaleString();
  }
  const prompt = entry.prompt || 0;
  const cacheRead = entry.cacheHit || 0;                                  // tokenFlow.cacheHit = cacheReadTokens
  const uncached = entry.uncachedInput != null ? entry.uncachedInput : Math.max(0, prompt - cacheRead);
  const output = entry.completion || 0;
  const reasoning = entry.reasoning || 0;
  const total = entry.total || (prompt + output);
  const hitPct = fmtHitPct(cacheRead, prompt);
  const row = {
    _seq: entry.seq,
    timeStr: getTimeStr(entry.ts),
    route: entry.route || (window.__tokenRoute || ""),
    uncached: uncached,
    cacheRead: cacheRead,
    output: output,
    reasoning: reasoning,
    total: total,
    hitPct: hitPct,
    status: entry.status || "ok",
    detail: {
      reqText: entry.reqText || "", respText: entry.respText || "",
      catSystem: entry.catSystem || 0, catUser: entry.catUser || 0,
      catToolRequest: entry.catToolRequest || 0, catToolResponse: entry.catToolResponse || 0,
      catTools: entry.catTools || 0, catContent: entry.catContent || 0,
      catThinking: entry.catThinking || 0, catOther: entry.catOther || 0 }
  };
  // upsert：同 seq 已有行则原位替换（进行中预览持续刷新 / 终态结算覆盖），否则追加
  if (entry.seq != null) {
    const idx = tokenLogList.findIndex(it => it._seq === entry.seq);
    if (idx >= 0) tokenLogList[idx] = row;
    else tokenLogList.push(row);
  } else {
    tokenLogList.push(row);
  }
  renderTokenLog();
  if (tokenLog) tokenLog.scrollTop = tokenLog.scrollHeight;
  if (isLive) { refreshTokenView(); return; }   // 进行中：圆环由前端 content/thinking 事件实时驱动，此处只刷列表
  refreshTokenBreakdown(entry);
  refreshTokenView();
}

// ── Token 流水分页恢复（切回会话时首屏；分页：最近一页 + total/hasMore）──
// payload 由 ChatBridge.restoreTokenFlow 构造：{entries: [...], total, offset, limit, hasMore}
// entries 顺序为「最新→最早」（后端从文件尾部倒序取），写入 tokenLogList 前需再反转成「最早→最新」保持数组时序。
// 注意：entries 已剥离 reqText/respText 大字段（原始报文可达 MB 级，整页携带会拖垮 WebView），
// 改带 lineIndex（磁盘行号），「查看」详情时按需经 getTokenFlowDetail 取回。
function handleTokenFlowRestore(payload) {
  if (!payload || !payload.entries) return;
  const entries = payload.entries || [];
  tokenFlowTotal = payload.total || 0;
  hasOlderTokenFlows = !!payload.hasMore;
  // offset 基线 = 本次已注入条数（与消息分页同理，避免首拉重复最新一页）
  olderTokenFlowsOffset = (payload.offset || 0) + entries.length;
  // 首屏恢复：清空旧列表（同一会话重新切回场景），按「最早→最新」顺序规范化写入。
  // 必须归一成 appendTokenLogRow 的行结构（timeStr/route/uncached/...），否则渲染列全空。
  tokenLogList = entries.slice().reverse().map(e => ({
    _seq: e.seq,
    timeStr: getTimeStr(e.ts),
    route: e.route || (window.__tokenRoute || ""),
    uncached: e.uncachedInput != null ? e.uncachedInput : Math.max(0, (e.prompt || 0) - (e.cacheHit || 0)),
    cacheRead: e.cacheHit || 0,
    output: e.completion || 0,
    reasoning: e.reasoning || 0,
    total: e.total || ((e.prompt || 0) + (e.completion || 0)),
    hitPct: fmtHitPct(e.cacheHit || 0, e.prompt || 0),
    status: e.status || "ok",
    detail: {
      lineIndex: e.lineIndex,
      catSystem: e.catSystem || 0, catUser: e.catUser || 0,
      catToolRequest: e.catToolRequest || 0, catToolResponse: e.catToolResponse || 0,
      catTools: e.catTools || 0, catContent: e.catContent || 0,
      catThinking: e.catThinking || 0, catOther: e.catOther || 0
    }
  }));
  renderTokenLog();
  // 恢复概览指标：以最新一条（数组末尾）为准，与逐条 pushTokenFlow 的终态一致
  const newest = entries[0];
  if (newest) {
    lastPromptTokens = newest.prompt || 0;
    liveStreamTokens = 0;
    if (panelCum) panelCum.textContent = (newest.cumulative || 0).toLocaleString();
    refreshTokenBreakdown(newest);
  }
  refreshTokenView();
  // 若流水容器可滚动，保持视口在底部（最新一条可见）
  if (typeof tokenLog !== "undefined" && tokenLog) {
    tokenLog.scrollTop = tokenLog.scrollHeight;
  }
}

// ── Token 流水向上滚动加载更早一页 ──
function loadOlderTokenFlows() {
  if (loadingOlderTokenFlows || !hasOlderTokenFlows) return;
  loadingOlderTokenFlows = true;
  try {
    const sid = (window.ChatBridge && window.ChatBridge.getCurrentSessionIdForJs)
      ? window.ChatBridge.getCurrentSessionIdForJs()
      : (window.__currentSessionId || "");
    const limit = window.__tokenFlowPageSize || 50;
    const offset = olderTokenFlowsOffset;
    let payload = {};
    try {
      const raw = window.ChatBridge.getTokenFlowPage(sid, offset, limit) || "{}";
      payload = JSON.parse(raw) || {};
    } catch (e) {
      console.warn("loadOlderTokenFlows: getTokenFlowPage 异常", e);
    }
    const entries = payload.entries || [];
    if (!entries.length) {
      hasOlderTokenFlows = false;
      return;
    }
    // 后端返回「最新→最早」顺序；prepend 到列表前需再反转成「最早→最新」，
    // 并归一成 appendTokenLogRow 的行结构（同 handleTokenFlowRestore）。
    const reversed = entries.slice().reverse().map(e => ({
      timeStr: getTimeStr(e.ts),
      route: e.route || (window.__tokenRoute || ""),
      uncached: e.uncachedInput != null ? e.uncachedInput : Math.max(0, (e.prompt || 0) - (e.cacheHit || 0)),
      cacheRead: e.cacheHit || 0,
      output: e.completion || 0,
      reasoning: e.reasoning || 0,
      total: e.total || ((e.prompt || 0) + (e.completion || 0)),
      hitPct: fmtHitPct(e.cacheHit || 0, e.prompt || 0),
      status: e.status || "ok",
      detail: {
        lineIndex: e.lineIndex,
        catSystem: e.catSystem || 0, catUser: e.catUser || 0,
        catToolRequest: e.catToolRequest || 0, catToolResponse: e.catToolResponse || 0,
        catTools: e.catTools || 0, catContent: e.catContent || 0,
        catThinking: e.catThinking || 0, catOther: e.catOther || 0
      }
    }));
    tokenLogList.unshift(...reversed);
    renderTokenLog();
    olderTokenFlowsOffset += entries.length;
    hasOlderTokenFlows = !!payload.hasMore;
  } catch (err) {
    console.warn("loadOlderTokenFlows error:", err);
  } finally {
    loadingOlderTokenFlows = false;
  }
}

// 模拟测试入口（保留）：mockAppendToken(未缓存, 缓存读, 输出, 推理, 状态)
function mockAppendToken(uncached, cacheRead, output, reasoning = 0, status = "ok") {
  const prompt = uncached + cacheRead;
  const total = uncached + cacheRead + output;
  appendTokenLogRow(getTimeStr(), window.__tokenRoute || "openai/mock-model", uncached, cacheRead, output, reasoning, total, fmtHitPct(cacheRead, prompt), status);
  updateTokenView(total);
}

// 输入框实时刷新（仅刷新视图，不增加流水）
inputEl.addEventListener("input", refreshTokenView);

// Token 流水上拉触顶：还有更早流水时自动加载下一页（分页）
if (typeof tokenLog !== "undefined" && tokenLog) {
  tokenLog.addEventListener("scroll", () => {
    if (hasOlderTokenFlows && !loadingOlderTokenFlows && tokenLog.scrollTop < 40) {
      loadOlderTokenFlows();
    }
  }, { passive: true });
}

// 初始化
updateTokenView(0);
renderTokenLog();
</script>
